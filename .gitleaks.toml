# gitleaks configuration, loaded automatically from the scanned repository root
# (CI: `gitleaks git .`; pre-commit hook). Extends the default ruleset.
title = "DataBastion gitleaks config"

[extend]
useDefault = true

# Agent secret issued at enrollment: "dbs_" + 43 base64url characters (256 bits).
[[rules]]
id = "databastion-agent-secret"
description = "DataBastion agent secret"
regex = '''\bdbs_[A-Za-z0-9_-]{43}\b'''
keywords = ["dbs_"]

# Single-use enrollment token: "dbe_" + 43 base64url characters.
[[rules]]
id = "databastion-enrollment-token"
description = "DataBastion enrollment token"
regex = '''\bdbe_[A-Za-z0-9_-]{43}\b'''
keywords = ["dbe_"]

# Webhook signing secret generated by the console: "whsec_" + 43 base64url characters (256 bits).
[[rules]]
id = "databastion-webhook-secret"
description = "DataBastion webhook signing secret"
regex = '''\bwhsec_[A-Za-z0-9_-]{43}\b'''
keywords = ["whsec_"]

# Documentation and fixture placeholders, e.g. dbs_EXAMPLEEXAMPLEEXAMPLEEXAMPLEEXAMPLEEXAMPLE0
[[allowlists]]
description = "DataBastion example credentials"
regexes = ['''db[se]_(EXAMPLE){6}[0-9]''']

# Test canaries used to prove secrets never reach logs or error messages
# (agent/crates/core tests). They are fake by construction.
[[allowlists]]
description = "DataBastion test canaries"
regexes = ['''hunter2-SECRET''', '''db[se]_(TOKEN){8}[0-9]{3}''']

# Console alerting test fixtures (fake by construction: "whsec_test-" prefix), and UUIDs, which
# are identifiers, never secrets (the generic rule fires on `key, "<uuid>"` call arguments).
[[allowlists]]
description = "DataBastion console test fixtures and UUIDs"
regexes = ['''whsec_test-[a-z0-9-]+''', '''\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b''']
