# Exemple de docker-compose pour DataBastion (MVP)
# À adapter selon l'implémentation réelle. Images publiées sur GHCR (voir RELEASE.md).
#
# Seule la console expose un port, et elle doit être placée derrière un
# reverse-proxy HTTPS. Les agents n'exposent AUCUN port (outbound only).

name: databastion

services:
  console:
    image: ghcr.io/yil00/databastion-console:latest
    command: ["web"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:3000"   # à publier via le reverse-proxy HTTPS
    environment:
      DATABASE_URL_FILE: /run/secrets/db_url
      DATABASTION_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      DATABASTION_PUBLIC_URL: https://databastion.example.com
      TZ: Europe/Paris
    secrets: [db_url, encryption_key]
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: ghcr.io/yil00/databastion-console:latest
    command: ["worker"]          # politiques, corrélation, alerting
    restart: unless-stopped
    environment:
      DATABASE_URL_FILE: /run/secrets/db_url
      DATABASTION_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      TZ: Europe/Paris
    secrets: [db_url, encryption_key]
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: databastion
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: databastion
    secrets: [db_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Pas de "ports:" : la base interne n'est jamais exposée.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U databastion -d databastion"]
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  db_password:
    file: ./secrets/db_password
  db_url:
    file: ./secrets/db_url            # postgresql://databastion:<mdp>@db:5432/databastion
  encryption_key:
    file: ./secrets/encryption_key    # openssl rand -base64 32

volumes:
  postgres-data:

