# Example docker-compose for DataBastion (MVP)
# Adapt to the actual implementation. Images are published on GHCR (see RELEASE.md).
#
# Only the console exposes a port, and it must be placed behind an
# HTTPS reverse proxy. Agents expose NO port (outbound-only).

name: databastion

# Console image, pinned by version tag (never `latest`): one place to change on upgrade. Use a
# published tag (RELEASE.md: `X.Y.Z` or `X.Y.Z-alpha.N`, no `v` prefix); `0.1.0-alpha.1` is the first
# planned pre-release: it is published with that first pre-release (end of phase 2), and does not
# exist on GHCR before then. For a fully immutable pin, append the digest: `...:<tag>@sha256:<digest>`
# (verify it first: `cosign verify`, see RELEASE.md).
x-console-image: &console-image ghcr.io/yil00/databastion-console:0.1.0-alpha.1

services:
  # One image (console/Dockerfile), four commands: web (default), worker, migrate, bootstrap-admin.
  # First administrator, once, after `migrate`:
  #   docker compose run --rm -e DATABASTION_BOOTSTRAP_ADMIN_USERNAME=admin \
  #     -e DATABASTION_BOOTSTRAP_ADMIN_PASSWORD_FILE=/run/secrets/admin_password \
  #     console bootstrap-admin
  #   (add `admin_password` to the console secrets for that run; remove the file afterwards)

  # One-shot: applies the console migrations as the database OWNER role, then exits.
  migrate:
    image: *console-image
    command: ["migrate"]         # src/db/migrate.ts (pnpm db:migrate)
    restart: "no"
    environment:
      DATABASE_MIGRATION_URL_FILE: /run/secrets/db_owner_url
    secrets: [db_owner_url]
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy

  console:
    image: *console-image
    command: ["web"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:3000"   # to be published through the HTTPS reverse proxy
    environment:
      DATABASE_URL_FILE: /run/secrets/db_url
      DATABASTION_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      DATABASTION_PUBLIC_URL: https://databastion.example.com
      # The console runs behind ONE HTTPS reverse proxy that sets / overwrites X-Forwarded-For.
      # Remove this line if nothing in front of the console does (clients could spoof their IP).
      # Several chained proxies: DATABASTION_TRUSTED_PROXY_HOPS: "<N>" instead.
      DATABASTION_TRUST_PROXY: "1"
      # Prometheus scrape token for GET /metrics (ADR-0004); /metrics answers 404 when unset.
      DATABASTION_METRICS_TOKEN_FILE: /run/secrets/metrics_token
      # /metrics on a dedicated listener, never on port 3000 (which then answers 404 there).
      # 0.0.0.0 inside the container, but the port is NOT published ("ports:" above): a Prometheus
      # on this compose network scrapes http://console:9464/metrics with
      # authorization.credentials_file = the metrics_token secret.
      DATABASTION_METRICS_PORT: "9464"
      DATABASTION_METRICS_HOST: 0.0.0.0
      # System alerts per notification channel and hour, all agents together (default 20).
      # Heartbeats and integrity events raise them here too: keep the worker's value.
      # DATABASTION_SYSTEM_ALERTS_MAX_PER_HOUR: "20"
      TZ: Europe/Paris
    secrets: [db_url, encryption_key, metrics_token]
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:                 # liveness only, no database access (readiness: /api/health/ready)
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: *console-image
    command: ["worker"]          # policies, correlation, alerting
    restart: unless-stopped
    # Alerting (P3-C): the worker is the only process that connects out (SMTP relay, webhook
    # receivers), directly (no proxy); allow that egress in your firewall. Webhooks to private or
    # loopback addresses are refused (SSRF defense).
    environment:
      DATABASE_URL_FILE: /run/secrets/db_url
      # Also decrypts the channel secrets (SMTP password, webhook URL and signing secret).
      DATABASTION_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      # Links to incidents / agents in the notifications.
      DATABASTION_PUBLIC_URL: https://databastion.example.com
      # "Silent agent" alert after N heartbeat intervals of 30 s (default 10 = 5 min).
      # DATABASTION_SILENT_AGENT_INTERVALS: "10"
      # Audit access events are deleted after N days (default 90, 7 to 3650).
      # DATABASTION_EVENTS_RETENTION_DAYS: "90"
      # System alerts per notification channel and hour, all agents together (default 20; same
      # value as the console service). Beyond: one digest per channel and hour.
      # DATABASTION_SYSTEM_ALERTS_MAX_PER_HOUR: "20"
      TZ: Europe/Paris
    secrets: [db_url, encryption_key]
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    # Pinned by tag AND digest (multi-arch index of postgres:17-alpine = 17.11 on Alpine 3.24,
    # resolved 2026-09-28). Update both together, to a digest you have checked.
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      # Bootstrap superuser: used only by the initdb script below, never by the console.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: databastion
    secrets: [db_password, db_owner_password, db_app_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the owner and runtime roles at first initialization (see the script).
      - ./initdb:/docker-entrypoint-initdb.d:ro
    # No "ports:": the internal database is never exposed.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d databastion"]
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  db_password:
    file: ./secrets/db_password       # bootstrap superuser (POSTGRES_USER), initdb only
  db_owner_password:
    file: ./secrets/db_owner_password # databastion_owner (NOSUPERUSER), used only by `migrate`
  db_owner_url:
    file: ./secrets/db_owner_url      # postgresql://databastion_owner:<db_owner_password>@db:5432/databastion
  db_app_password:
    file: ./secrets/db_app_password   # runtime role databastion_runtime (web + worker)
  db_url:
    file: ./secrets/db_url            # postgresql://databastion_runtime:<db_app_password>@db:5432/databastion
  encryption_key:
    file: ./secrets/encryption_key    # openssl rand -base64 32
  metrics_token:
    file: ./secrets/metrics_token     # openssl rand -base64 32 (>= 32 chars); also given to Prometheus
                                      # (scrape_configs: authorization.credentials_file)

volumes:
  postgres-data:

