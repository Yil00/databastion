# DataBastion agent with Docker Compose. COPY THIS FILE TO THE AGENT HOST: the host / network of
# the monitored databases, NOT the console host. On a database host, the .deb package (systemd
# service) is the documented path; this file is for container hosts (deploy/README.md).
#
#   cp agent-compose.example.yml compose.yaml        # in a directory of its own, on the agent host
#
# The agent opens no port (invariant I1). Its console URL, CA pin, targets and secret references
# come from agent.yaml (console.url, console.ca_file, targets; agent/agent.example.yaml): it reads
# no console URL from the environment.
#
# Image: pinned by tag AND the digest from the release's verified image-digests.txt, never
# `latest` (deploy/README.md, "Verify the artifacts"). In `.env` next to this file:
#   DATABASTION_AGENT_VERSION=0.1.0
#   DATABASTION_AGENT_DIGEST=<the 64 hex characters after sha256: in the agent line>
#
# Secrets (./secrets): the agent refuses secret files not owned by its own uid (10001) or readable
# by others, so each file is `0600`, owned by 10001, inside a `./secrets` directory that stays
# `0700` and owned by root (only root reaches the files on the host; the bind mount gives the
# container the file itself). uid 10001 must be unused on the host, or a dedicated account:
# whoever holds it can read these files.
#   sudo install -d -m 0700 -o root -g root secrets
#   sudo install -m 0600 -o 10001 -g 10001 /dev/stdin secrets/enrollment_token   # paste, Ctrl-D
#
# Enrollment is a one-shot `enroll`, before the first start, with the single-use token from the
# console, then the long-running agent, which never mounts the token:
#   docker compose --profile enroll run --rm agent-enroll
#   sudo rm secrets/enrollment_token
#   docker compose up -d agent
# Run both from THIS directory with the same project name (no different -p / COMPOSE_PROJECT_NAME):
# the identity is written to the project's `agent-state` volume, and another project would start
# with an empty one, the single-use token already spent.

name: databastion-agent

x-agent: &agent
  image: ghcr.io/yil00/databastion-agent:${DATABASTION_AGENT_VERSION:?set it in .env}@sha256:${DATABASTION_AGENT_DIGEST:?set it in .env (from image-digests.txt)}
  volumes:
    - ./agent.yaml:/etc/databastion/agent.yaml:ro     # console.url, targets + secret refs
    - agent-state:/var/lib/databastion                # identity, HMAC key, spool
    # - ./console-ca.pem:/etc/databastion/console-ca.pem:ro  # if console.ca_file is set (DATABASTION_TLS=internal)
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # One-shot, profile `enroll`: exchanges the single-use token for the agent identity.
  agent-enroll:
    <<: *agent
    profiles: [enroll]
    restart: "no"
    command: ["enroll", "--config", "/etc/databastion/agent.yaml",
              "--token-file", "/run/secrets/enrollment_token"]
    secrets: [enrollment_token]

  # The agent (image default command: run --config /etc/databastion/agent.yaml).
  agent:
    <<: *agent
    restart: unless-stopped
    volumes:
      - ./agent.yaml:/etc/databastion/agent.yaml:ro
      - agent-state:/var/lib/databastion
      # - ./console-ca.pem:/etc/databastion/console-ca.pem:ro  # if console.ca_file is set (DATABASTION_TLS=internal)
      # Audit log files, read-only; give the agent read access through a group (group_add), never
      # ownership (agent README, "Audit log files"):
      # - /var/log/postgresql:/logs/postgresql:ro
    # group_add: ["<gid of the log files>"]
    secrets: [pg_password]      # the target password files named in agent.yaml (`secret: {file: ...}`)

secrets:
  enrollment_token:
    file: ./secrets/enrollment_token   # delete after `enroll`
  pg_password:
    file: ./secrets/pg_password        # example; agent.yaml: secret: {file: /run/secrets/pg_password}

volumes:
  agent-state:
