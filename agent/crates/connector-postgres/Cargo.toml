[package]
name = "databastion-connector-postgres"
description = "DataBastion agent: PostgreSQL connector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Architecture rule: a connector depends on `databastion-core` (trait, sinks)
# and `databastion-classifiers` (masking) only. Never on an HTTP client: it has
# no access to the uplink (checked by crates/agent/tests/architecture.rs).
[dependencies]
databastion-core.workspace = true
databastion-classifiers.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
tracing.workspace = true
zeroize.workspace = true
# Driver (extended protocol, binary results, server-side cancellation) and
# TLS (rustls only, `ring` provider, system roots or a pinned CA file).
tokio-postgres.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
rustls-native-certs.workspace = true
futures-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "io-util"] }
serde_json = "1"
tracing-subscriber.workspace = true

[lints]
workspace = true
