[package]
name = "databastion-protocol-codegen"
description = "Developer tool: generates databastion-protocol's Rust types from shared/protocol/openapi.yaml (not shipped in the agent)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
prettyplease = "0.2"
quote = "1"
schemars = "0.8"
serde_json = "1"
serde_yaml = "0.9"
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "visit-mut"] }
thiserror.workspace = true
typify = { version = "0.8", default-features = false }

[lints]
workspace = true
