[package]
name = "databastion-protocol-codegen"
description = "Developer tool: generates databastion-protocol's Rust types from shared/protocol/openapi.yaml (not shipped in the agent)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
prettyplease = "0.3"
quote = "1"
schemars = "1.2"
serde_json = "1"
# Maintained fork of the deprecated serde_yaml (same API).
serde_yaml_ng = "0.10"
syn = { version = "3", default-features = false, features = ["full", "parsing", "printing", "visit-mut"] }
thiserror.workspace = true
typify = { version = "0.8", default-features = false }

[lints]
workspace = true
