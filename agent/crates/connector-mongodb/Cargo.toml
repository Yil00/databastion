[package]
name = "databastion-connector-mongodb"
description = "DataBastion agent: MongoDB connector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Architecture rule: a connector depends on `databastion-core` (trait, sinks)
# and `databastion-classifiers` (masking) only. Never on an HTTP client: it has
# no access to the uplink (checked by crates/agent/tests/architecture.rs).
[dependencies]
databastion-core.workspace = true
databastion-classifiers.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "net", "io-util"] }
tracing.workspace = true
zeroize.workspace = true
# Client for a closed subset of the MongoDB wire protocol (`wire`, `bson`,
# `scram`), no driver crate (ADR-0026 decision 1): no topology discovery,
# SCRAM-SHA-256 only, bounded replies, no server text kept.
# TLS: rustls only, `ring` provider, system roots or a pinned CA file.
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
rustls-native-certs.workspace = true
# SCRAM-SHA-256: HMAC, SHA-256 (PBKDF2 is written on HMAC), SASLprep,
# base64 messages, a nonce from the OS.
hmac.workspace = true
sha2.workspace = true
stringprep = "0.1"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
getrandom = { version = "0.4", default-features = false }
# Audit (P5-B, P5-C): auditLog and server log JSON records, read with serde
# visitors that skip command values (no protocol types).
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

[features]
# Public entry points of the parsers for the fuzz targets (`agent/fuzz`,
# cargo-fuzz): never enabled by the agent binary.
fuzzing = []

[dev-dependencies]
# Test helpers of the core (owned log files, the contract conversion for
# the interim I2 checks): tests only.
databastion-core = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "io-util"] }
tracing-subscriber.workspace = true
# Property tests of the BSON reader, the wire framing and the field paths
# (src/proptests.rs).
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
