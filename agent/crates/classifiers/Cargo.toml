[package]
name = "databastion-classifiers"
description = "DataBastion agent: sensitive data classifiers and masking (the only producer of uplink-bound samples)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hmac.workspace = true
regex.workspace = true
sha2.workspace = true
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
# Property tests check normalized names against the generated contract
# `Identifier` type (test only; the library does not depend on it).
databastion-protocol.workspace = true
# Property tests on masking and fingerprints (test only).
proptest = { version = "1", default-features = false, features = ["std"] }
# Parses the dev seed (dev/seed/out/mongo.json) in the ground-truth evaluation.
serde_json = "1"

[lints]
workspace = true
