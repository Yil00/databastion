# Coverage-guided fuzz targets (cargo-fuzz, libFuzzer) for the parsers a hostile
# server or log writer feeds: MongoDB BSON, OP_MSG, auditLog / server log lines and
# profiler entries; OpenLDAP BER, LDAPMessage, logged search filters and
# cn=accesslog entries; Redis / Valkey RESP3 replies, INFO sections and key names; CAS service definitions (JSON and YAML, the YAML parser also against
# serde_yaml_ng as a differential oracle) and JSON audit log lines. See
# README.md.
#
# Its own workspace, outside the agent workspace: `cargo test` and `cargo clippy`
# in agent/ never build it, and the agent binary never links libFuzzer. The
# connectors expose their entry points only with their `fuzzing` feature.
[package]
name = "databastion-fuzz"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
databastion-connector-mongodb = { path = "../crates/connector-mongodb", features = ["fuzzing"] }
databastion-connector-openldap = { path = "../crates/connector-openldap", features = ["fuzzing"] }
databastion-connector-cas = { path = "../crates/connector-cas", features = ["fuzzing"] }
databastion-connector-redis = { path = "../crates/connector-redis", features = ["fuzzing"] }
databastion-connector-sqlserver = { path = "../crates/connector-sqlserver", features = ["fuzzing"] }
# The oracle of the differential target cas_registry_yaml_diff (ADR-0046): the YAML parser
# connector-cas used before its own.
serde_yaml_ng = "0.10"

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "mongodb_bson"
path = "fuzz_targets/mongodb_bson.rs"
test = false
doc = false
bench = false

