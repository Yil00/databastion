# Coverage-guided fuzz targets (cargo-fuzz, libFuzzer) for the parsers a hostile
# server or log writer feeds: MongoDB BSON, OP_MSG, auditLog / server log lines and
# profiler entries; OpenLDAP BER, LDAPMessage, logged search filters and
# cn=accesslog entries. See README.md.
#
# Its own workspace, outside the agent workspace: `cargo test` and `cargo clippy`
# in agent/ never build it, and the agent binary never links libFuzzer. The
# connectors expose their entry points only with their `fuzzing` feature.
[package]
name = "databastion-fuzz"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
databastion-connector-mongodb = { path = "../crates/connector-mongodb", features = ["fuzzing"] }
databastion-connector-openldap = { path = "../crates/connector-openldap", features = ["fuzzing"] }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "mongodb_bson"
path = "fuzz_targets/mongodb_bson.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mongodb_op_msg"
path = "fuzz_targets/mongodb_op_msg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mongodb_audit_log"
path = "fuzz_targets/mongodb_audit_log.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mongodb_server_log"
path = "fuzz_targets/mongodb_server_log.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mongodb_profiler"
path = "fuzz_targets/mongodb_profiler.rs"
test = false
doc = false
bench = false

[[bin]]
name = "openldap_ber"
path = "fuzz_targets/openldap_ber.rs"
test = false
doc = false
bench = false

[[bin]]
name = "openldap_message"
path = "fuzz_targets/openldap_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "openldap_filter"
path = "fuzz_targets/openldap_filter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "openldap_accesslog"
path = "fuzz_targets/openldap_accesslog.rs"
test = false
doc = false
bench = false
