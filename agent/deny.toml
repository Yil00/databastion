# cargo-deny policy for the agent workspace, run by CI:
#   cargo deny --locked check bans licenses sources
# Complements crates/agent/tests/architecture.rs. Lifting a ban requires a
# security-reviewer review (and an ADR when it touches an invariant).

[graph]
all-features = true
# Dev-dependencies are never linked into the shipped binary. Test-only HTTP
# mock servers (wiremock, bound to 127.0.0.1 inside tests) pull hyper's
# `server` feature; excluding dev-dependencies keeps the bans below strict
# for everything the binary links. `cargo tree -e normal` (no dev edges) is
# the graph checked here.
exclude-dev = true

[advisories]
# RUSTSEC-2024-0449: `unsafe-libyaml` is unmaintained (archived by its
# author). The shipped binary reaches it only through `serde_yaml_ng`, used
# by databastion-core to read `agent.yaml`, a root-owned file (ADR-0046
# decision 5). CAS YAML registries use the agent's own parser (ADR-0046
# decision 1). The workspace tool protocol-codegen (a dev-dependency of the
# protocol crate, never linked into the agent) reaches it the same way.
# Scoped by ADR-0046 decision 6; remove this ignore when
# `agent.yaml` moves off `serde_yaml_ng`. cargo-deny ignores by id only;
# the dependency paths are guarded by the `wrappers` entries under [bans].
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml only via serde_yaml_ng for the root-owned agent.yaml and the protocol-codegen tool, paths guarded by [bans] wrappers (ADR-0046 decisions 5 and 6)" },
]

[licenses]
# Licenses compatible with distributing the agent under Apache-2.0 (ADR-0005).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9
# The allow-list anticipates future dependencies (sqlx, reqwest, rustls…).
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
# Internal crates are path dependencies without a version (publish = false).
wildcards = "deny"
allow-wildcard-paths = true

deny = [
    # ADR-0046: `unsafe-libyaml` (RUSTSEC-2024-0449, ignored under
    # [advisories]) only through `serde_yaml_ng`, and `serde_yaml_ng` only
    # in the core (`agent.yaml`, decision 5) and the protocol-codegen tool.
    # A new normal-graph user of either crate fails this check.
    { crate = "serde_yaml_ng", wrappers = ["databastion-core", "databastion-protocol-codegen"], reason = "ADR-0046 decision 5: agent.yaml only" },
    { crate = "unsafe-libyaml", wrappers = ["serde_yaml_ng"], reason = "ADR-0046: only through serde_yaml_ng" },
    # ADR-0059 decision 1: the bundled SQLite C library, only through rusqlite,
    # and rusqlite only in the SQLite connector. A reviewed exception to
    # "no C client library" (ADR-0039 decision 4); widening it needs an ADR.
    { crate = "rusqlite", wrappers = ["databastion-connector-sqlite"], reason = "ADR-0059 decision 1: SQLite connector only" },
    { crate = "libsqlite3-sys", wrappers = ["rusqlite"], reason = "ADR-0059 decision 1: bundled SQLite only through rusqlite" },
    # ADR-0059 decision 4: the reader sandbox.
    { crate = "landlock", wrappers = ["databastion-connector-sqlite"], reason = "ADR-0059 decision 4: SQLite reader sandbox only" },
    { crate = "seccompiler", wrappers = ["databastion-connector-sqlite"], reason = "ADR-0059 decision 4: SQLite reader sandbox only" },
    { crate = "nix", wrappers = ["databastion-connector-sqlite"], reason = "ADR-0059 decision 4: the reader closes its inherited descriptors" },
    # ADR-0060 decision 1: the Firebird connector speaks the remote protocol
    # itself; no Firebird C client (fbclient) and no driver crate.
    { name = "rsfbclient", reason = "no Firebird C client, ADR-0060 decision 1" },
    { name = "rsfbclient-native", reason = "no Firebird C client, ADR-0060 decision 1" },
    { name = "rsfbclient-rust", reason = "own bounded client, ADR-0060 decision 1" },
    { name = "rsfbclient-core", reason = "own bounded client, ADR-0060 decision 1" },
    { name = "firebirust", reason = "own bounded client, ADR-0060 decision 1" },
    { name = "fbclient-sys", reason = "no Firebird C client, ADR-0060 decision 1" },
    { name = "ibase-sys", reason = "no Firebird C client, ADR-0060 decision 1" },
    # TLS: rustls only (AGENTS.md).
    { name = "openssl", reason = "rustls only" },
    { name = "openssl-sys", reason = "rustls only" },
    { name = "openssl-src", reason = "rustls only" },
    { name = "native-tls", reason = "rustls only" },
    # ADR-0051 decision 1 (security review L12): a single crypto provider,
    # `ring`; no C-based second provider compiled in unnoticed.
    { name = "aws-lc-rs", reason = "single ring provider, ADR-0051 decision 1" },
    { name = "aws-lc-sys", reason = "single ring provider, ADR-0051 decision 1" },
    # I1: the agent opens no inbound port, so no HTTP / RPC server frameworks.
    { name = "axum", reason = "I1: no inbound port" },
    { name = "actix-web", reason = "I1: no inbound port" },
    { name = "warp", reason = "I1: no inbound port" },
    { name = "tiny_http", reason = "I1: no inbound port" },
    { name = "tonic", reason = "I1: no inbound port; gRPC is post-MVP and needs an ADR" },
    # Opens a listener (tokio-console gRPC server).
    { name = "console-subscriber", reason = "I1: opens a listening port" },
    # ADR-0004: agent metrics go through the heartbeat. The future opt-in
    # `metrics.local_listen` (127.0.0.1 only) gets a reviewed exception.
    { name = "metrics-exporter-prometheus", reason = "ADR-0004: no scrape endpoint on the agent" },
]

# HTTP server side of hyper / hyper-util (the client side stays allowed for reqwest).
features = [
    { crate = "hyper", deny = ["server"] },
    { crate = "hyper-util", deny = ["server", "server-auto", "server-graceful"] },
    # ADR-0059 decision 1: only these features of the SQLite crates may be
    # enabled (no load_extension, loadable_extension, vtab, functions, trace,
    # backup, blob, serialize, session, sqlcipher, buildtime_bindgen,
    # with-asan outside the fuzz workspace, or the integrations).
    { crate = "rusqlite", allow = ["bundled", "modern_sqlite", "hooks", "limits"] },
    # `default` is `min_sqlite_version_3_34_1` (cargo-deny 0.20 lists it as a
    # feature of its own); the bundled build ignores pkg-config and vcpkg.
    { crate = "libsqlite3-sys", allow = ["bundled", "bundled_bindings", "cc", "default", "min_sqlite_version_3_34_1", "pkg-config", "vcpkg"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
