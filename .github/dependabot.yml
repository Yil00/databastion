# All updates target `dev` (see RELEASE.md). Commit prefixes follow Conventional Commits.
# /shared/protocol arrives with P0-B: until then Dependabot reports a missing manifest for it,
# which is harmless.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      release-tooling:
        patterns: ["*"]

  # Console (pnpm: Dependabot's npm ecosystem reads pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /console
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(console)
    ignore:
      # ESLint stays on 9: eslint-plugin-react (via eslint-config-next) does not support 10 yet.
      - dependency-name: eslint
        versions: [">=10"]
      # TypeScript stays on 5.x: typescript-eslint (via eslint-config-next) does not support 7 yet.
      - dependency-name: typescript
        versions: [">=6"]
      # @types/node follows the console's Node.js major (24, ci.yml and the console image).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      console:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /agent
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(agent)
    groups:
      agent:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /shared/protocol
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(protocol)
    groups:
      protocol:
        patterns: ["*"]
