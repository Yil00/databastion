# All updates target `dev` (see RELEASE.md). Commit prefixes follow Conventional Commits.
# /shared/protocol arrives with P0-B: until then Dependabot reports a missing manifest for it,
# which is harmless.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      release-tooling:
        patterns: ["*"]

  # Console (pnpm: Dependabot's npm ecosystem reads pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /console
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(console)
    ignore:
      # ESLint stays on 9: eslint-plugin-react (via eslint-config-next) does not support 10 yet.
      - dependency-name: eslint
        versions: [">=10"]
    groups:
      console:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /agent
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(agent)
    ignore:
      # protocol-codegen: syn, prettyplease and schemars must match the versions typify uses;
      # they move together with a typify upgrade, never on their own.
      - dependency-name: syn
        update-types: ["version-update:semver-major"]
      - dependency-name: prettyplease
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: schemars
        update-types: ["version-update:semver-major"]
    groups:
      agent:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /shared/protocol
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(protocol)
    groups:
      protocol:
        patterns: ["*"]
