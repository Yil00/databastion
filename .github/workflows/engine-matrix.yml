name: Engine matrix

# Connector integration tests (the "dev image" step of the ci.yml agent-pg / agent-mysql /
# agent-mongodb / agent-redis / agent-sqlserver jobs, through dev/agent-it.sh) against several
# versions of each engine: the dev services of dev/docker-compose.yml with their image overridden
# by the DATABASTION_DEV_*_IMAGE variables (ROADMAP v0.1.x follow-up (h)). Entries without an override run
# the pinned default images, as ci.yml does. Percona Server (MySQL, MongoDB) and OpenLDAP stay
# single-version (ci.yml).
# Redis and Valkey (ADR-0052 decision 13 and open question 7): every maintained line here, one
# version of each in ci.yml (agent-redis); the services are in the opt-in Compose profile `redis`.
# SQL Server (ADR-0051 decision 9 and refinement item 3): 2019, 2022 and 2025 Express here, 2022 in
# ci.yml (agent-sqlserver); the service is in the opt-in Compose profile `sqlserver`. The TLS mode
# each version reaches is asserted by the tests (tls_modes_by_version): `mandatory` and the `auto`
# fallback on 2019 and 2022, `strict` on 2025 with DATABASTION_DEV_SQLSERVER_FORCE_STRICT=1.
# Measurements (ROADMAP phase 9 follow-ups), uploaded as the artifact `measure-<engine>-<version>`:
#   - SQL Server (#276 review L1): the M2 drift table of
#     `listed_object_reads_are_recorded_or_named_invisible` (`M2 | major | object | account | …`,
#     printed by the main test run), and the fresh-server test
#     `xe_fresh_server_own_reads_raise_no_event` run first on the new data volume
#     (DATABASTION_IT_SQLSERVER_FRESH=1: the `sysaudacts` and `sysguidrefs` builds, with the
#     captured events of their activity, DATABASTION_IT_SQLSERVER_CAPTURE, fake data only). The
#     fresh-server step never fails the job: it is a measurement on 2019 and 2025.
#   - MySQL / MariaDB (#256): the digests of the agent's performance_schema poll and stats texts as
#     each service renders them, in the format of the connector's fixture poll_digests.tsv
#     (dev/capture-poll-digests.sh, after the tests sent every text).
# Job e2e-sqlserver (ROADMAP phase 9 follow-up P9-D): e2e/sqlserver.sh on the versions and Audit
# sources the required ci.yml job (2022, SQL Server Audit) does not run: 2022 with Extended Events,
# 2019 (Extended Events only) and 2025 with each source, the I2 check and incidents included.
# Not a required check: not part of the "CI result" gate of ci.yml.
# Every image is pinned by tag AND index digest (multi-arch), like the rest of the repository.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths:
      - ".github/workflows/engine-matrix.yml"
      - "dev/docker-compose.yml"
      - "dev/agent-it.sh"
      - "dev/postgres/**"
      - "dev/mysql/**"
      - "dev/mariadb/**"
      - "dev/mongo/**"
      - "dev/redis/**"
      - "dev/sqlserver/**"
      - "dev/capture-poll-digests.sh"
      - "e2e/sqlserver.sh"
      - "e2e/docker-compose.sqlserver.yml"
      - "agent/crates/core/**"
      - "agent/crates/connector-postgres/**"
      - "agent/crates/connector-mysql/**"
      - "agent/crates/connector-mongodb/**"
      - "agent/crates/connector-redis/**"
      - "agent/crates/connector-sqlserver/**"

permissions:
  contents: read

concurrency:
  group: engine-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: ${{ matrix.engine }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    # 60: the SQL Server entries also run the fresh-server measurement before the tests.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # PostgreSQL (dev/postgres: the official image + PGDG pgaudit for its major). jsonlog
          # needs PostgreSQL 15+: 14 writes the pgaudit log as csvlog. 14 is the minimum tested
          # version: 13 (end of life) has no pg_stat_statements_info, through which the connector
          # proves pg_stat_statements loaded (docs/08-engine-capabilities.md).
          - engine: PostgreSQL
            version: "14.24"
            it: postgres
            services: postgres
            postgres_image: postgres:14.24-bookworm@sha256:dcc2ca942d8518144f387a0c2630188427835f984caaed0418b986928e761809
            postgres_tag: "14.24"
            postgres_log_format: csvlog
          - engine: PostgreSQL
            version: "15.19"
            it: postgres
            services: postgres
            postgres_image: postgres:15.19-bookworm@sha256:539ceaaae49b3a7c8a04467cf00cc6788d8e3f1675df41860d86eebc4c40524f
            postgres_tag: "15.19"
          - engine: PostgreSQL
            version: "16.15"
            it: postgres
            services: postgres
            postgres_image: postgres:16.15-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
            postgres_tag: "16.15"
          - engine: PostgreSQL
            version: "17.11 (default)"
            it: postgres
            services: postgres
          - engine: PostgreSQL
            version: "18.6"
            it: postgres
            services: postgres
            postgres_image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
            postgres_tag: "18.6"
          # MySQL Community. dev/agent-it.sh mysql also runs the MariaDB and Percona services
          # at their default versions: the same tests and DATABASTION_TEST_REQUIRE as ci.yml.
          - engine: MySQL
            version: "8.0.46"
            it: mysql
            services: mysql mariadb percona
            mysql_image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
          - engine: MySQL
            version: "8.4.11 (default)"
            it: mysql
            services: mysql mariadb percona
          - engine: MySQL
            version: "9.7.2"
            it: mysql
            services: mysql mariadb percona
            mysql_image: mysql:9.7.2@sha256:e2bde46db6563855d7177adb5f0b57b9dc663f5a20927a90f4259d3312068497
          # MariaDB (the MySQL and Percona services at their default versions, as above).
          - engine: MariaDB
            version: "10.11.19"
            it: mysql
            services: mysql mariadb percona
            mariadb_image: mariadb:10.11.19@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
          - engine: MariaDB
            version: "11.4.13 (default)"
            it: mysql
            services: mysql mariadb percona
          - engine: MariaDB
            version: "11.8.9"
            it: mysql
            services: mysql mariadb percona
            mariadb_image: mariadb:11.8.9@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15
          # MongoDB Community (5.0+ is enforced by the connector).
          - engine: MongoDB
            version: "6.0.28"
            it: mongodb
            services: mongo
            mongo_image: mongo:6.0.28@sha256:8b6d8f5bbedb25cb73517b65cf99f13aeb75ad5b157a56c479287a840bbad3ac
          - engine: MongoDB
            version: "7.0.43"
            it: mongodb
            services: mongo
            mongo_image: mongo:7.0.43@sha256:1f995ad6fdb93244a1addab1b58f934a0bc2f5643c38e02f5e9d7f0c7d227a7b
          - engine: MongoDB
            version: "8.0.32 (default)"
            it: mongodb
            services: mongo
          # Redis (ADR-0052 decision 2: the lines Redis maintains, 6.2 and 7.2 under extended support;
          # 8.0 is not maintained). dev/agent-it.sh redis also runs the Valkey service at its default
          # version, and dev/redis/entrypoint.sh adapts the ACL to the version (Redis 6.2: no read-only
          # key patterns, no ACL DRYRUN, no CLIENT NO-TOUCH). Redis 6.2 is refused without the local
          # opt-in `redis.unevaluated_acl: accept` (decision 4): the connector-redis tests that expect
          # a healthy account fail on it until they take that path (5 of them on 2026-10-14).
          - engine: Redis
            version: "6.2.24"
            it: redis
            profile: redis
            services: valkey redis
            redis_image: redis:6.2.24@sha256:a9c881672688090a1a9fee7277c69174398acd5369f0bdb8bb58726c43b98a2a
          - engine: Redis
            version: "7.2.16"
            it: redis
            profile: redis
            services: valkey redis
            redis_image: redis:7.2.16@sha256:46f15cf64fdef63e483dcda99e74e3d51c017b1175547b6bb874152ee2391aad
          - engine: Redis
            version: "7.4.11"
            it: redis
            profile: redis
            services: valkey redis
            redis_image: redis:7.4.11@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
          - engine: Redis
            version: "8.2.10"
            it: redis
            profile: redis
            services: valkey redis
            redis_image: redis:8.2.10@sha256:47670742d7924adbcdb404d1288b6327815b23141969c0939b8e5d61f78c2634
          - engine: Redis
            version: "8.4.7"
            it: redis
            profile: redis
            services: valkey redis
            redis_image: redis:8.4.7@sha256:43afe4a9a43080e64dfa29699eef903fc9d54991fe8b03d57237c05bed2a396c
          - engine: Redis
            version: "8.6.7"
            it: redis
            profile: redis
            services: valkey redis
            redis_image: redis:8.6.7@sha256:192fab3335680aa420049026a18dc6baa30a69406cd29af35145bca0523d781a
          - engine: Redis
            version: "8.8.3"
            it: redis
            profile: redis
            services: valkey redis
            redis_image: redis:8.8.3@sha256:eb1aa641bc5380ed14442398e45a5a51aeaaac919fab811e4f134eb77c71dd2d
          - engine: Redis
            version: "8.10.2 (default)"
            it: redis
            profile: redis
            services: valkey redis
          # Valkey (every maintained minor; the Redis service at its default version, as above).
          - engine: Valkey
            version: "7.2.14"
            it: redis
            profile: redis
            services: valkey redis
            valkey_image: valkey/valkey:7.2.14@sha256:ef0f9fb533b1f06fb7aba6478d758ca1c077d49e2bcb2b4365a4ea7f50b6d42e
          - engine: Valkey
            version: "8.0.11"
            it: redis
            profile: redis
            services: valkey redis
            valkey_image: valkey/valkey:8.0.11@sha256:4436c94fc34ce4af0354b9379d433a1f258998fb955f995c89822f98c14a8cab
          - engine: Valkey
            version: "8.1.10"
            it: redis
            profile: redis
            services: valkey redis
            valkey_image: valkey/valkey:8.1.10@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2
          - engine: Valkey
            version: "9.0.6 (default)"
            it: redis
            profile: redis
            services: valkey redis
          - engine: Valkey
            version: "9.1.2"
            it: redis
            profile: redis
            services: valkey redis
            valkey_image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
          # Microsoft SQL Server, Express (MSSQL_PID=Express in docker-compose.yml: the maintainer's
          # choice until the Developer license terms are confirmed for CI, ADR-0051 open question
          # 13). amd64-only images, pinned by digest (ADR-0051 decision 9). sqlserver_major is the
          # major version the tests require the server to report.
          # 2019: no strict encryption (TDS 8.0 is 2022+): `mandatory`, and `auto` falling back.
          - engine: SQL Server
            version: "2019 (15.0.4500.2)"
            it: sqlserver
            profile: sqlserver
            services: sqlserver
            sqlserver_image: mcr.microsoft.com/mssql/server:2019-latest@sha256:07d7dedecdbfcf6776035dc5eefb5bfd9aa1804b2f6b99f7dedb397d8a599069
            sqlserver_major: "15"
          # 2022 on Linux: no strict setting in mssql-conf (refinement item 3): `auto` falls back
          # to `mandatory`, `strict` fails with its local detail.
          - engine: SQL Server
            version: "2022 (16.0.4305.5, default)"
            it: sqlserver
            profile: sqlserver
            services: sqlserver
            sqlserver_major: "16"
          # 2025 with network.forcestrict: `strict` and `auto` reaching strict (persisted "strict
          # seen" mark), `mandatory` refused by the server.
          - engine: SQL Server
            version: "2025 (17.0.5015.4, strict)"
            it: sqlserver
            profile: sqlserver
            services: sqlserver
            sqlserver_image: mcr.microsoft.com/mssql/server:2025-latest@sha256:742481d1b1186cccc81220a1eaacef244ca8d0f7d19c8e5c70df8ae541ffbab2
            sqlserver_major: "17"
            sqlserver_force_strict: "1"
    # Unset matrix fields are empty strings: docker-compose.yml and dev/agent-it.sh treat an empty
    # variable as unset (`${VAR:-default}`), so the entry runs the pinned default.
    env:
      DATABASTION_DEV_POSTGRES_IMAGE: ${{ matrix.postgres_image }}
      DATABASTION_DEV_POSTGRES_TAG: ${{ matrix.postgres_tag }}
      DATABASTION_DEV_POSTGRES_LOG_FORMAT: ${{ matrix.postgres_log_format }}
      DATABASTION_DEV_MYSQL_IMAGE: ${{ matrix.mysql_image }}
      DATABASTION_DEV_MARIADB_IMAGE: ${{ matrix.mariadb_image }}
      DATABASTION_DEV_MONGO_IMAGE: ${{ matrix.mongo_image }}
      DATABASTION_DEV_REDIS_IMAGE: ${{ matrix.redis_image }}
      DATABASTION_DEV_VALKEY_IMAGE: ${{ matrix.valkey_image }}
      DATABASTION_DEV_SQLSERVER_IMAGE: ${{ matrix.sqlserver_image }}
      DATABASTION_DEV_SQLSERVER_FORCE_STRICT: ${{ matrix.sqlserver_force_strict }}
      DATABASTION_IT_SQLSERVER_MAJOR: ${{ matrix.sqlserver_major }}
      # Opt-in Compose profiles of the entry (Redis / Valkey: `redis`, SQL Server: `sqlserver`);
      # empty for the others.
      COMPOSE_PROFILES: ${{ matrix.profile }}
      IT_ENGINE: ${{ matrix.it }}
      SERVICES: ${{ matrix.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: agent
          key: ${{ matrix.it }}
      - name: Start the dev services
        run: |
          cp dev/.env.example dev/.env
          make dev-dirs
          # shellcheck disable=SC2086 # SERVICES is a space-separated list of service names
          timeout 900 docker compose -f dev/docker-compose.yml up -d --build --wait --wait-timeout 600 $SERVICES
          timeout 60 docker compose -f dev/docker-compose.yml images
          mkdir -p "$RUNNER_TEMP/measure"
      # SQL Server, first on the new data volume (#276 review L1): the fresh-server test alone, which
      # the main run skips (it needs DATABASTION_IT_SQLSERVER_FRESH=1). A measurement: its result
      # does not fail the job (the step's outcome is in the summary).
      - name: SQL Server fresh-server measurement
        id: fresh
        if: matrix.it == 'sqlserver'
        continue-on-error: true
        env:
          DATABASTION_IT_SQLSERVER_FRESH: "1"
        run: |
          set -o pipefail
          status=0
          DATABASTION_IT_SQLSERVER_CAPTURE="$RUNNER_TEMP/measure/fresh-capture.txt" \
            timeout 1500 dev/agent-it.sh sqlserver xe_fresh_server_own_reads_raise_no_event 2>&1 \
            | tee "$RUNNER_TEMP/measure/fresh.log" || status=$?
          # A test that stopped midway keeps the Extended Events grant it gave the agent login
          # (2022+): taken back as `sa`, so that the main run starts from the dev grants.
          if [ "$status" -ne 0 ] && [ "${DATABASTION_IT_SQLSERVER_MAJOR:-16}" -ge 16 ]; then
            # shellcheck disable=SC2016 # expanded by the container shell, on purpose
            timeout 120 docker compose -f dev/docker-compose.yml exec -T sqlserver bash -c '
              enc=(-C)
              if [ "${DATABASTION_DEV_SQLSERVER_FORCE_STRICT:-0}" = 1 ]; then enc=(-N s -J /var/opt/mssql/databastion-tls/server.pem); fi
              SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" exec /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa "${enc[@]}" -b \
                -Q "REVOKE VIEW SERVER PERFORMANCE STATE FROM databastion"' || true
          fi
          exit "$status"
      # Not continue-on-error: the main run must never start with the fresh-server test's
      # Extended Events grant still held by the agent login (2022+; on 2019 the grant is the dev
      # script's own). Fails the job when the grant is still there or cannot be read.
      - name: SQL Server grants after the measurement
        if: matrix.it == 'sqlserver' && matrix.sqlserver_major != '15'
        run: |
          # shellcheck disable=SC2016 # expanded by the container shell, on purpose
          n="$(timeout 120 docker compose -f dev/docker-compose.yml exec -T sqlserver bash -c '
            enc=(-C)
            if [ "${DATABASTION_DEV_SQLSERVER_FORCE_STRICT:-0}" = 1 ]; then enc=(-N s -J /var/opt/mssql/databastion-tls/server.pem); fi
            SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" exec /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa "${enc[@]}" -b -h -1 -W \
              -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.server_permissions p JOIN sys.server_principals s
                  ON s.principal_id = p.grantee_principal_id WHERE s.name = N'"'"'databastion'"'"'
                  AND p.permission_name = N'"'"'VIEW SERVER PERFORMANCE STATE'"'"' AND p.state IN ('"'"'G'"'"', '"'"'W'"'"')"' \
            | tr -d '[:space:]')"
          if [ "$n" != 0 ]; then
            echo "::error title=Extended Events grant left::the agent login still holds VIEW SERVER PERFORMANCE STATE after the fresh-server measurement (count '${n}'): the main run would start with an extra grant"
            exit 1
          fi
          echo "the agent login holds no VIEW SERVER PERFORMANCE STATE: the main run starts from the dev grants"
      # Same commands, variables and DATABASTION_TEST_REQUIRE as the "dev image" step of the ci.yml
      # job of this engine (dev/agent-it.sh); every probe is required.
      - name: Connector integration tests
        run: |
          set -o pipefail
          timeout 1800 dev/agent-it.sh "$IT_ENGINE" 2>&1 | tee "$RUNNER_TEMP/it.log"
      # The measurement tables, whatever the tests' result. Every line comes from the dev fixtures
      # (fake data) or from the agent's constant texts; nothing secret is printed by these tests.
      - name: Measurement tables
        id: measure
        if: always() && (matrix.it == 'sqlserver' || matrix.it == 'mysql')
        env:
          ENTRY: ${{ matrix.engine }} ${{ matrix.version }}
          FRESH_OUTCOME: ${{ steps.fresh.outcome }}
        run: |
          d="$RUNNER_TEMP/measure"
          mkdir -p "$d"
          printf '%s\n' "$ENTRY" >"$d/entry.txt"
          {
            echo "### Measurements: $ENTRY"
            if [ "$IT_ENGINE" = sqlserver ]; then
              # With --nocapture the first line of a test can follow its `test … ...` prefix.
              grep -oE '(M2 \| |\[it\] m2: ).*' "$RUNNER_TEMP/it.log" >"$d/m2.txt" 2>/dev/null || true
              # ADR-0055 name case facts (catalog_collation_type, ComparisonStyle, case-only duplicates).
              grep -oE '\[it\] name_case: .*' "$RUNNER_TEMP/it.log" >"$d/name_case.txt" 2>/dev/null || true
              grep -oE '(\[it\] xe fresh|panicked at|^test .* (ok|FAILED|ignored)$|test result: ).*' \
                "$d/fresh.log" >"$d/fresh-summary.txt" 2>/dev/null || true
              echo "M2 drift table: $(grep -c '^M2 | ' "$d/m2.txt" || true) row(s) (m2.txt); fresh-server test: ${FRESH_OUTCOME:-not run}"
              echo '```'
              cat "$d/fresh-summary.txt" 2>/dev/null || true
              echo '```'
              echo "name case: $(grep -c 'name_case: ' "$d/name_case.txt" || true) line(s) (name_case.txt)"
              echo '```'
              cat "$d/name_case.txt" 2>/dev/null || true
              echo '```'
            else
              timeout 300 dev/capture-poll-digests.sh >"$d/poll_digests.tsv" || echo "capture incomplete (see poll_digests.tsv)"
              echo "poll and stats digests: $(grep -vc '^#' "$d/poll_digests.tsv" || true) row(s) (poll_digests.tsv)"
              echo '```'
              grep '^#' "$d/poll_digests.tsv" || true
              cut -f1-4 "$d/poll_digests.tsv" | grep -v '^#' || true
              echo '```'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          # The full rows in the job log too (readable without the artifact): `sed -n l` shows
          # tabs as \t and ends each row with `$`, so the MariaDB digests' trailing space stays visible.
          if [ -f "$d/poll_digests.tsv" ]; then
            echo "poll_digests.tsv of $ENTRY:"
            sed -n l "$d/poll_digests.tsv"
          fi
      - name: Upload the measurements
        if: always() && steps.measure.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # entry.txt names the entry (engine and version).
          name: measure-${{ matrix.it }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/measure/
          retention-days: 30
          if-no-files-found: ignore
      - name: Service logs
        if: failure()
        run: |
          # shellcheck disable=SC2086
          timeout 120 docker compose -f dev/docker-compose.yml logs --no-color --tail=300 $SERVICES
      # Last before Stop, so that the end of the job log shows why the tests failed.
      - name: Failure summary
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/it.log" ] || exit 0
          grep -nE "panicked at|^test .* FAILED$|^failures:$|^---- |test result: FAILED|^error|^\[it\] " "$RUNNER_TEMP/it.log" | head -n 120 || true
          grep -nA12 "panicked at" "$RUNNER_TEMP/it.log" | head -n 120 || true
      - name: Stop
        if: always()
        run: timeout 120 docker compose -f dev/docker-compose.yml down -v

  # e2e/sqlserver.sh (e2e/README.md "SQL Server target", "Other versions and the Extended Events
  # source") on what the required ci.yml job e2e-sqlserver (2022, SQL Server Audit) does not run:
  # the Extended Events source on 2022, SQL Server 2019 (Extended Events, its only source) and 2025
  # (each source; without forced strict, the TLS mode `auto` reaches is printed). Each entry: the
  # console and agent images built, enrollment, the honest level, Discovery against the ground
  # truth, no own event, a bcp export raising a critical incident, reads and DCL incidents, and the
  # I2 check. The images of 2019 and 2025 are the engine matrix pins above (sqlserver.sh checks).
  e2e-sqlserver:
    name: E2E SQL Server ${{ matrix.version }} (${{ matrix.source }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "2022"
            source: sqlserver_xevents
          - version: "2019"
            source: sqlserver_xevents
          - version: "2025"
            source: sqlserver_audit
          - version: "2025"
            source: sqlserver_xevents
    env:
      E2E_LOG_DIR: ${{ github.workspace }}/e2e-sqlserver-logs
      E2E_SQLSERVER_VERSION: ${{ matrix.version }}
      E2E_SQLSERVER_AUDIT_SOURCE: ${{ matrix.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version
          openssl version
          python3 --version
      - name: shellcheck
        run: timeout 60 shellcheck -x e2e/sqlserver.sh e2e/lib.sh
      - name: Run e2e/sqlserver.sh
        # Within the job budget (45 min): cleanup always completes. Every line goes to the job log
        # unchanged (the runner reads the `::add-mask::` commands there); the copy kept for the
        # summary leaves those commands out, since each one holds a secret in clear text. A plain
        # loop rather than `tee >(…)`: it ends with the pipeline, so the copy is complete when the
        # step ends, and pipefail keeps sqlserver.sh's exit status.
        run: |
          set -o pipefail
          : >"$RUNNER_TEMP/e2e.log"
          timeout 2280 e2e/sqlserver.sh 2>&1 | while IFS= read -r line || [ -n "$line" ]; do
            printf '%s\n' "$line"
            case "$line" in
              ::add-mask::*) ;;
              *) printf '%s\n' "$line" >>"$RUNNER_TEMP/e2e.log" ;;
            esac
          done
      - name: Summary
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/e2e.log" ] || exit 0
          {
            echo "### E2E SQL Server $E2E_SQLSERVER_VERSION ($E2E_SQLSERVER_AUDIT_SOURCE)"
            echo '```'
            grep -E '\] (target-mssql: |mssql-e2e: (checked|SQL Server|audit level)|Audit: (bcp start|exporter events|.* hold .* statement)|all checks passed|PASS$|FAIL: |timings: )' \
              "$RUNNER_TEMP/e2e.log" || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-sqlserver-logs-${{ matrix.version }}-${{ matrix.source }}
          path: e2e-sqlserver-logs/
          retention-days: 7
          if-no-files-found: ignore
