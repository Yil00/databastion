name: Publish

# Builds and publishes multi-architecture images to GHCR, signed with cosign (keyless), then the
# agent .deb files, the deployment bundle, SHA256SUMS and its cosign bundle as GitHub release
# assets. Triggered ONLY by the push of a release tag (ADR-0034), so that every signature carries
# the identity `…/.github/workflows/publish.yml@refs/tags/<version>` with the `push` trigger:
# - X.Y.Z (pushed by release-it from release.yml)   → tags X.Y.Z, X.Y, latest
# - X.Y.Z-… (pre-release, pushed by a maintainer)   → tags X.Y.Z-…, next (never latest)
# The jobs that push or sign run in the `release` GitHub Environment (reviewers and tag rules:
# RELEASE.md, "Repository configuration"). Builds use no cache: nothing another workflow wrote
# can end up in a release. An image is only built if its Dockerfile exists.
#
# Chain of trust (deploy/README.md, "Verify the artifacts"):
# - images: built natively per architecture with SBOM + SLSA provenance attestations (BuildKit),
#   merged into one index, signed by digest (the signature covers the index, hence the platform
#   images and their attestations); the signature and the attestations are verified right after;
# - .deb: the binary is copied out of the signed agent image (verified first), packaged with nfpm
#   (reproducible, deploy/deb/build.sh);
# - SHA256SUMS (the .deb files and image-digests.txt) signed with `cosign sign-blob` (bundle).
# - the deployment bundle databastion-deploy-<version>.tar.gz: reproducible `git archive` of deploy/.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  prepare:
    name: Preparation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read   # read the `release` environment's protection rules (settings guard)
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      images: ${{ steps.images.outputs.images }}
    steps:
      - id: meta
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_EVENT_NAME" != push ]; then
            echo "::error::publish.yml only runs on a tag push"; exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version: $VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          [[ "$VERSION" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ADR-0034 relies on repository settings the maintainer makes (RELEASE.md, section 6): refuse
      # to publish without them. A defence against a forgotten setup only.
      - name: Release settings in place
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/check-release-settings.sh environment release tag
          .github/scripts/check-release-settings.sh tag-ruleset
      - name: Images to build
        id: images
        run: |
          images=()
          for c in console agent; do [ -f "$c/Dockerfile" ] && images+=("\"$c\""); done
          json="[$(IFS=,; echo "${images[*]}")]"
          echo "Images: $json"
          echo "images=$json" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.images != '[]' && needs.prepare.outputs.images != ''
    strategy:
      fail-fast: true
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.images) }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/databastion-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same configuration as packaging.yml's publish-dry-run job, which runs it without a push on
      # pull requests. Context = the component directory (its .dockerignore applies).
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=databastion-${{ matrix.image }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          no-cache: true
          pull: true
      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Manifest & signature ${{ matrix.image }}
    needs: [prepare, build]
    if: needs.prepare.outputs.images != '[]' && needs.prepare.outputs.images != ''
    strategy:
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.images) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Create multi-arch manifest and sign
        id: sign
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          IMAGE_KIND: ${{ matrix.image }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/databastion-${IMAGE_KIND}"
          sources=()
          for d in /tmp/digests/*; do sources+=("$IMAGE@sha256:$(basename "$d")"); done
          # Only the version tag here; `next` / `X.Y` / `latest` move after the verification below.
          docker buildx imagetools create -t "$IMAGE:$VERSION" "${sources[@]}"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "$IMAGE@$DIGEST"
          echo "ref=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "pin=$IMAGE:$VERSION@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published: $IMAGE:$VERSION ($DIGEST)" >> "$GITHUB_STEP_SUMMARY"
      # What users run (deploy/README.md): the signature must verify with the documented identity,
      # from this very run (workflow commit), and each platform must carry its SBOM and provenance.
      - name: Verify the signature and the attestations
        env:
          REF: ${{ steps.sign.outputs.ref }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cosign verify "$REF" \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@refs/tags/${VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-trigger push \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-sha "$GITHUB_SHA" >/dev/null
          echo "cosign verify: OK"
          docker buildx imagetools inspect "$REF" --format '{{json .Provenance}}' >"$RUNNER_TEMP/provenance.json"
          docker buildx imagetools inspect "$REF" --format '{{json .SBOM}}' >"$RUNNER_TEMP/sbom.json"
          for platform in linux/amd64 linux/arm64; do
            jq -e --arg p "$platform" '.[$p].SLSA | type == "object" and length > 0' "$RUNNER_TEMP/provenance.json" >/dev/null \
              || { echo "::error::no provenance attestation for $platform"; exit 1; }
            jq -e --arg p "$platform" '.[$p].SPDX | type == "object" and length > 0' "$RUNNER_TEMP/sbom.json" >/dev/null \
              || { echo "::error::no SBOM attestation for $platform"; exit 1; }
            echo "$platform: SBOM and provenance attached"
          done
      - name: Move the floating tags to the verified index
        env:
          REF: ${{ steps.sign.outputs.ref }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          IMAGE="${REF%@*}"
          if [ "$PRERELEASE" = "true" ]; then
            tags=(-t "$IMAGE:next")
          else
            tags=(-t "$IMAGE:${VERSION%.*}" -t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$REF"
      # image-digests.txt (release asset): the tag and digest form that deploy/README.md pins.
      - name: Save the image reference
        env:
          REF: ${{ steps.sign.outputs.pin }}
          IMAGE_KIND: ${{ matrix.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/ref"
          echo "$REF" > "$RUNNER_TEMP/ref/image-${IMAGE_KIND}.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.image }}
          path: ${{ runner.temp }}/ref/image-${{ matrix.image }}.txt
          if-no-files-found: error
          retention-days: 7

  # Agent .deb for amd64 and arm64, from the binary of the signed agent image (verified first).
  deb:
    name: Agent .deb
    needs: [prepare, manifest]
    if: contains(needs.prepare.outputs.images, '"agent"')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-agent
          path: ${{ runner.temp }}/ref
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install nfpm (pinned, checksum database verified)
        run: |
          nfpm="$(deploy/deb/install-nfpm.sh "$RUNNER_TEMP/bin")"
          echo "NFPM=$nfpm" >> "$GITHUB_ENV"
      - name: Build the .deb files from the signed image
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          pin="$(cat "$RUNNER_TEMP/ref/image-agent.txt")"   # <repo>:<tag>@sha256:<digest>
          repo="${pin%@*}"
          REF="${repo%:*}@${pin##*@}"
          cosign verify "$REF" \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@refs/tags/${VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-trigger push \
            --certificate-github-workflow-sha "$GITHUB_SHA" >/dev/null
          for arch in amd64 arm64; do
            docker pull -q --platform "linux/$arch" "$REF" >/dev/null
            id="$(docker create --platform "linux/$arch" "$REF")"
            docker cp "$id:/usr/local/bin/databastion-agent" "$RUNNER_TEMP/databastion-agent-$arch"
            docker rm "$id" >/dev/null
            docker rmi "$REF" >/dev/null
            deploy/deb/build.sh --binary "$RUNNER_TEMP/databastion-agent-$arch" --arch "$arch" \
              --version "$VERSION" --out "$RUNNER_TEMP/deb-$arch"
          done
          # Pre-release tags do not bump agent/Cargo.toml (RELEASE.md): the binary may report an
          # older version than the package.
          v="$("$RUNNER_TEMP/databastion-agent-amd64" --version)"
          [ "$v" = "databastion-agent $VERSION" ] || echo "::warning::the agent binary reports '$v' for release $VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-amd64
          path: ${{ runner.temp }}/deb-amd64/*.deb
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-arm64
          path: ${{ runner.temp }}/deb-arm64/*.deb
          if-no-files-found: error
          retention-days: 7

  # Release assets: the .deb files, image-digests.txt, SHA256SUMS and its cosign bundle. Uploaded to
  # the draft release (release-it creates it for X.Y.Z; for a pre-release tag, a draft pre-release
  # is created here). The maintainer reviews and publishes it (RELEASE.md).
  release-assets:
    name: Release assets (SHA256SUMS signed)
    needs: [prepare, manifest, deb]
    if: ${{ !failure() && !cancelled() && needs.manifest.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write   # upload the release assets
      id-token: write   # keyless cosign signing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.deb.result == 'success'
        with:
          pattern: deb-*
          merge-multiple: true
          path: ${{ runner.temp }}/assets
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Checksums, signature, upload
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # Deployment bundle (deploy/README.md): reproducible, same bytes for the same tag.
          git archive --format=tar --prefix="databastion-deploy-${VERSION}/" HEAD deploy \
            | gzip -n -9 > "$RUNNER_TEMP/assets/databastion-deploy-${VERSION}.tar.gz"
          cd "$RUNNER_TEMP/assets"
          cat image-*.txt > image-digests.txt
          rm -f image-*.txt
          files=(image-digests.txt "databastion-deploy-${VERSION}.tar.gz")
          for f in *.deb; do [ -e "$f" ] && files+=("$f"); done
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.cosign.bundle SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.cosign.bundle \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@refs/tags/${VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-trigger push \
            --certificate-github-workflow-sha "$GITHUB_SHA" SHA256SUMS
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            flags=(--draft --verify-tag --generate-notes --title "$VERSION")
            [ "$PRERELEASE" = true ] && flags+=(--prerelease)
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
          fi
          # A published release is never modified: assets are only attached to a draft.
          draft="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          [ "$draft" = true ] || { echo "::error::release $VERSION is not a draft: refusing to change its assets"; exit 1; }
          gh release upload "$VERSION" --repo "$GITHUB_REPOSITORY" --clobber \
            "${files[@]}" SHA256SUMS SHA256SUMS.cosign.bundle
          {
            echo "### Release assets"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # "Installation < 15 min" with the published artifacts: the console image pulled from GHCR inside
  # the timed window, the .deb files built above (deploy/install-test.sh).
  install-test:
    name: Installation test (published artifacts)
    needs: [prepare, manifest, deb]
    if: contains(needs.prepare.outputs.images, '"console"') && contains(needs.prepare.outputs.images, '"agent"')
    uses: ./.github/workflows/packaging.yml
    with:
      build-deb: false
      published-images: true
      # Pre-release tags do not bump agent/Cargo.toml (RELEASE.md): no version check for them.
      expected-version: ${{ needs.prepare.outputs.prerelease == 'true' && 'any' || needs.prepare.outputs.version }}
    permissions:
      contents: read
      packages: read
