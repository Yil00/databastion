name: Dev environment

# Builds and smoke-tests the dev environment (dev/). Independent of ci.yml: not part of the required
# "CI result" check for now.
on:
  push:
    branches: [main, dev]
    paths:
      - "dev/**"
      - "Makefile"
      - ".github/workflows/dev-env.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "dev/**"
      - "Makefile"
      - ".github/workflows/dev-env.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-env-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-env:
    name: Dev environment
    runs-on: ubuntu-latest
    # The opt-in CAS step builds its overlay image (about 170 MB of modules from Maven Central).
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dev credentials (dev-only example values)
        run: cp dev/.env.example dev/.env
      - name: Seed generator tests
        run: timeout 300 python3 -m unittest discover -s dev/seed -v
      - name: Seed files up to date
        run: timeout 120 python3 dev/seed/generate.py --check
      - name: Compose file valid
        run: docker compose -f dev/docker-compose.yml config -q
      - name: Start (build, up --wait)
        run: make dev UP_TIMEOUT=900 WAIT_TIMEOUT=600
      - name: Smoke tests
        run: make dev-smoke
      # The dev Keycloak image comes from the project's Docker Hub repository: its digest must be the
      # one the project publishes on quay.io, its canonical registry.
      - name: Keycloak image provenance (Docker Hub index digest equals quay.io)
        run: |
          ref=$(sed -n 's/.*DATABASTION_DEV_KEYCLOAK_IMAGE:-\(keycloak\/keycloak:[^@]*\)@\(sha256:[0-9a-f]*\)}.*/\1 \2/p' dev/docker-compose.yml)
          read -r image pinned <<<"$ref"
          [ -n "$image" ] && [ -n "$pinned" ] || { echo "::error::no pinned keycloak image in dev/docker-compose.yml"; exit 1; }
          hub=$(timeout 120 docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          quay=$(timeout 120 docker buildx imagetools inspect "quay.io/$image" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          echo "pinned $pinned, Docker Hub $hub, quay.io $quay"
          [ "$pinned" = "$hub" ] && [ "$hub" = "$quay" ] || { echo "::error::keycloak image digests differ"; exit 1; }
      # Opt-in Keycloak (OIDC test realm, ADR-0038): import, healthcheck and realm checks.
      - name: Keycloak (OIDC test realm)
        run: |
          make dev-keycloak UP_TIMEOUT=600 WAIT_TIMEOUT=300
          make dev-keycloak-smoke
      # Opt-in Apereo CAS (target of the CAS connector, ADR-0041): overlay image build (modules
      # resolved from Maven Central, versions locked and SHA-256-verified, dev/cas/overlay), then
      # registry, login, service ticket, audit log, file permission and ticket table grant checks.
      - name: Apereo CAS (overlay build, registry, audit trail)
        run: |
          make dev-cas UP_TIMEOUT=1500 WAIT_TIMEOUT=600
          make dev-cas-smoke
      # Opt-in SQLite files (ADR-0059 decision 10): the seeded files the writer sidecar wrote, their
      # permissions (decision 2: directory 2750, files 0640 with its group) and the WAL file held
      # open (its -wal and -shm exist).
      - name: SQLite (seeded files, writer sidecar)
        run: |
          make dev-sqlite UP_TIMEOUT=600 WAIT_TIMEOUT=300
          timeout 60 docker compose -f dev/docker-compose.yml --profile sqlite exec -T sqlite python3 -I -c '
          import os, stat
          d = "/data"
          names = sorted(os.listdir(d))
          assert {"crm.db", "app.db", "intl.db", "app.db-wal", "app.db-shm"} <= set(names), names
          top = os.stat(d)
          assert stat.S_IMODE(top.st_mode) == 0o2750, oct(top.st_mode)
          for n in names:
              s = os.lstat(os.path.join(d, n))
              assert stat.S_ISREG(s.st_mode) and stat.S_IMODE(s.st_mode) == 0o640, n
              assert (s.st_uid, s.st_gid) == (top.st_uid, top.st_gid), n
          print("sqlite files:", " ".join(names))'
      - name: Service status and logs
        if: failure()
        run: |
          docker compose -f dev/docker-compose.yml --profile psmdb --profile keycloak --profile cas --profile sqlite ps -a
          # Every service but cas, whose log prints the keys CAS generates at start (dev only).
          services=$(docker compose -f dev/docker-compose.yml --profile psmdb --profile keycloak --profile cas --profile sqlite config --services | grep -vx cas)
          # shellcheck disable=SC2086 # a space-separated list of service names
          timeout 120 docker compose -f dev/docker-compose.yml --profile psmdb --profile keycloak --profile cas --profile sqlite logs --no-color --tail=300 $services
          # cas: its log lines without the generated keys.
          timeout 60 docker compose -f dev/docker-compose.yml --profile cas logs --no-color --tail=300 cas | grep -viE 'generated .*key|key \[' || true
      - name: Stop
        if: always()
        run: make dev-reset
