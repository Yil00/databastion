name: Release

# When a PR is merged into main (dev → main or hotfix/* → main):
# computes the version, generates the CHANGELOG, creates the tag, creates a draft GitHub release,
# then publishes the images. Add [skip-release] to the PR title to publish nothing.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release-it
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.title, '[skip-release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN secret missing: see RELEASE.md, 'Repository configuration' section."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Rust (to update agent/Cargo.lock)
        if: hashFiles('agent/Cargo.lock') != ''
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      # The release commit carries the repository owner's noreply identity:
      # no bot account appears among the contributors.
      - name: Git identity
        env:
          GIT_NAME: ${{ vars.RELEASE_GIT_NAME || github.repository_owner }}
          GIT_EMAIL: ${{ vars.RELEASE_GIT_EMAIL || format('{0}+{1}@users.noreply.github.com', github.repository_owner_id, github.repository_owner) }}
        run: |
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"

      - name: release-it
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION=$(npx release-it --ci --release-version)
          echo "Computed version: $VERSION"
          npx release-it --ci
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish images
    needs: release
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
