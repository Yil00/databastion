name: Load / database impact

# e2e/load/run.sh (e2e/load/README.md): database CPU impact of a Discovery scan of a scaled-up seed
# (PostgreSQL, MariaDB, MongoDB; MVP criterion < 2 %), the Audit path under a sustained workload
# (pgbench, sysbench; nothing dropped, p95 latency with and without Audit) and the agent's CPU / RSS
# over a 10-minute run. About 30 minutes: NOT part of the required "CI result" check (ci.yml).
# load-cas, load-sqlserver and load-redis run the CAS, SQL Server and Valkey / Redis targets the same way.
# Runs weekly, on demand, and on pull requests labelled `load-test`; the harness unit tests run on
# every pull request.
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:
    inputs:
      soak_s:
        description: Length of the workload with Audit, in seconds (also the agent resource run)
        required: false
        default: "600"
      only:
        description: Run one job only (all, database, cas, sqlserver, redis)
        required: false
        type: choice
        options: [all, database, cas, sqlserver, redis]
        default: all
      sqlserver_audit_source:
        description: "load-sqlserver: Audit source (sqlserver_xevents: the Extended Events catch-up measurement, #282 review N3)"
        required: false
        type: choice
        options: [sqlserver_audit, sqlserver_xevents]
        default: sqlserver_audit
      sqlserver_rate:
        description: "load-sqlserver: workload SELECTs per second (empty: 300 with sqlserver_audit, 50 with sqlserver_xevents)"
        required: false
        default: ""
      sqlserver_stats_reset_s:
        description: "load-sqlserver: drop the load schema's auto-created statistics every N seconds of the Audit run (0: never)"
        required: false
        default: "0"
      sqlserver_large_every_s:
        description: "load-sqlserver, sqlserver_xevents only: a burst of 60 statements near the 128 KiB event bound every N seconds of the Audit run (0: never; ADR-0051 refinement of 2026-10-22)"
        required: false
        default: "0"
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Load harness unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests (seed generator, sampler, analysis)
        run: timeout 120 python3 -m unittest discover -s e2e/load -p 'test_*.py' -v
      - name: shellcheck
        run: shellcheck -x e2e/load/run.sh e2e/load/cas.sh e2e/load/sqlserver.sh e2e/load/redis.sh e2e/load/side-clients.sh e2e/load/pg-side-clients.sh e2e/load/initdb/*.sh

  load:
    name: Load / database impact
    needs: unit
    # Pull requests: only with the `load-test` label, and on a `labeled` event only when that label
    # is the one added (adding another label does not start a run). The label stays across new
    # commits: remove and re-apply it after reviewing new commits from a fork.
    if: (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'load-test') && (github.event.action != 'labeled' || github.event.label.name == 'load-test'))) && (github.event_name != 'workflow_dispatch' || inputs.only == '' || inputs.only == 'all' || inputs.only == 'database')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LOAD_LOG_DIR: ${{ github.workspace }}/load-logs
      LOAD_RESULTS_DIR: ${{ github.workspace }}/load-results
      LOAD_SOAK_S: ${{ inputs.soak_s || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version
          echo "CPUs: $(nproc)"; free -m | head -n 2
          stat -fc 'cgroup filesystem: %T' /sys/fs/cgroup
      - name: Run e2e/load/run.sh
        run: e2e/load/run.sh
      # Counters, timings and latencies only: no seeded value, no secret (run.sh redacts every
      # generated secret from its outputs on exit, whatever the result).
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-results
          path: load-results/
          retention-days: 30
          if-no-files-found: ignore
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-logs
          path: load-logs/
          retention-days: 7
          if-no-files-found: ignore

  # The CAS target (e2e/load/README.md "CAS target", ADR-0041 decision 14): a CAS login workload
  # with and without Audit (events against the audit records, CAS login latency, CAS CPU), the agent's
  # CPU / RSS while it tails the busy audit log, and the CAS store guard's ticket aggregate on the
  # JPA ticket table the workload filled. In parallel with the database run, same triggers.
  load-cas:
    name: Load / CAS target
    needs: unit
    if: (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'load-test') && (github.event.action != 'labeled' || github.event.label.name == 'load-test'))) && (github.event_name != 'workflow_dispatch' || inputs.only == '' || inputs.only == 'all' || inputs.only == 'cas')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LOAD_LOG_DIR: ${{ github.workspace }}/load-cas-logs
      LOAD_RESULTS_DIR: ${{ github.workspace }}/load-cas-results
      LOAD_SOAK_S: ${{ inputs.soak_s || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version
          echo "CPUs: $(nproc)"; free -m | head -n 2
          stat -fc 'cgroup filesystem: %T' /sys/fs/cgroup
      - name: Run e2e/load/cas.sh
        # Within the job budget, so that cleanup (logs, redaction, teardown) always completes.
        run: timeout 3300 e2e/load/cas.sh
      # Counters, timings and latencies only (run.sh's format): no ticket, no secret (cas.sh redacts
      # every generated secret from its outputs on exit, whatever the result).
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-cas-results
          path: load-cas-results/
          retention-days: 30
          if-no-files-found: ignore
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-cas-logs
          path: load-cas-logs/
          retention-days: 7
          if-no-files-found: ignore

  # The SQL Server target (e2e/load/README.md "SQL Server target", ADR-0051 "End-to-end and load"):
  # SQL Server 2022 Express (the dev service, 2 CPUs), a paced Discovery scan of a scaled seed
  # against the < 2 % criterion, a fixed-rate point-select workload with and without SQL Server Audit
  # read by the agent (every statement an event, the engine-measured time per statement), the agent's
  # CPU / RSS. In parallel with the other runs, same triggers. On demand with the Extended Events
  # source (input sqlserver_audit_source, #282 review N3): the catch-up measurement in the summary and
  # in load-sqlserver-results/xe-catchup.json.
  load-sqlserver:
    name: Load / SQL Server target
    needs: unit
    if: (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'load-test') && (github.event.action != 'labeled' || github.event.label.name == 'load-test'))) && (github.event_name != 'workflow_dispatch' || inputs.only == '' || inputs.only == 'all' || inputs.only == 'sqlserver')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      LOAD_LOG_DIR: ${{ github.workspace }}/load-sqlserver-logs
      LOAD_RESULTS_DIR: ${{ github.workspace }}/load-sqlserver-results
      LOAD_SOAK_S: ${{ inputs.soak_s || '600' }}
      # Validated by sqlserver.sh (never interpolated into a script). An empty rate: the source's default.
      LOAD_SQLSERVER_AUDIT_SOURCE: ${{ inputs.sqlserver_audit_source || 'sqlserver_audit' }}
      LOAD_MSSQL_RATE: ${{ inputs.sqlserver_rate }}
      LOAD_SQLSERVER_STATS_RESET_S: ${{ inputs.sqlserver_stats_reset_s || '0' }}
      LOAD_SQLSERVER_LARGE_EVERY_S: ${{ inputs.sqlserver_large_every_s || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version
          echo "CPUs: $(nproc)"; free -m | head -n 2
          stat -fc 'cgroup filesystem: %T' /sys/fs/cgroup
      - name: Run e2e/load/sqlserver.sh
        # Within the job budget, so that cleanup (logs, redaction, teardown) always completes.
        run: timeout 4200 e2e/load/sqlserver.sh
      # Counters, timings and latencies only (run.sh's format): no seeded value, no secret
      # (sqlserver.sh redacts every generated secret from its outputs on exit, whatever the result).
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-sqlserver-results
          path: load-sqlserver-results/
          retention-days: 30
          if-no-files-found: ignore
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-sqlserver-logs
          path: load-sqlserver-logs/
          retention-days: 7
          if-no-files-found: ignore

  # The Valkey and Redis targets (e2e/load/README.md "Valkey and Redis targets", ADR-0052 decision 13
  # "Load"), one matrix entry each: Valkey 9.0 or Redis 8.10 (the dev services, 2 CPUs) with a keyspace of 1 000 000 keys, a paced Discovery scan
  # against the < 2 % criterion, a fixed-rate GET workload with and without the Audit stream reading
  # the slow log at every command (the polls' cost on the server, every GET an event), the agent's
  # CPU / RSS. In parallel with the other runs, same triggers.
  load-redis:
    name: Load / ${{ matrix.label }} target
    needs: unit
    if: (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'load-test') && (github.event.action != 'labeled' || github.event.label.name == 'load-test'))) && (github.event_name != 'workflow_dispatch' || inputs.only == '' || inputs.only == 'all' || inputs.only == 'redis')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Both engines of ADR-0052 (phase 9 exit criterion: a load run on each engine).
      matrix:
        include:
          - engine: valkey
            label: Valkey
          - engine: redis
            label: Redis
    env:
      LOAD_REDIS_ENGINE: ${{ matrix.engine }}
      LOAD_LOG_DIR: ${{ github.workspace }}/load-${{ matrix.engine }}-logs
      LOAD_RESULTS_DIR: ${{ github.workspace }}/load-${{ matrix.engine }}-results
      LOAD_SOAK_S: ${{ inputs.soak_s || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version
          echo "CPUs: $(nproc)"; free -m | head -n 2
          stat -fc 'cgroup filesystem: %T' /sys/fs/cgroup
      - name: Run e2e/load/redis.sh
        # Within the job budget, so that cleanup (logs, redaction, teardown) always completes.
        run: timeout 3300 e2e/load/redis.sh
      # Counters, timings and latencies only (run.sh's format): no key, no value, no secret
      # (redis.sh redacts every generated secret from its outputs on exit, whatever the result).
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-${{ matrix.engine }}-results
          path: load-${{ matrix.engine }}-results/
          retention-days: 30
          if-no-files-found: ignore
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-${{ matrix.engine }}-logs
          path: load-${{ matrix.engine }}-logs/
          retention-days: 7
          if-no-files-found: ignore
