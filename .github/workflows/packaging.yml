name: Packaging

# Agent .deb, release build path and installation tests (deploy/README.md):
# - publish-dry-run: the image builds of publish.yml (same build-push-action configuration: component
#                  directory as context, SBOM, max provenance, no cache), without a push, amd64;
#                  checks that each OCI index carries its attestation manifest;
# - deb:           builds the agent image of the checkout per architecture (agent/ as context, as
#                  publish.yml), copies its binary out, and packages it twice with nfpm
#                  (deploy/deb/build.sh): both builds must be identical (reproducible package);
# - deb-install:   installs each .deb in Debian 12 and Ubuntu 24.04 containers and checks users,
#                  files, owners, modes, the systemd unit (systemd-analyze verify / security),
#                  `--version`, reinstall, upgrade, remove and purge (deploy/deb/test-install.sh);
#                  then, with systemd as PID 1, the SQLite reader under the unit's own sandbox
#                  (e2e/sqlite-unit.sh) and the Firebird bare-host identity load and readers check
#                  under it (e2e/firebird-unit.sh, with the test binary of firebird-unit-bin);
# - firebird-unit-bin: the Firebird connector's library test binary, built in the agent
#                  Dockerfile's pinned builder image (Debian 12 glibc), for e2e/firebird-unit.sh: a
#                  test harness only, never packaged or released;
# - install-test:  smoke test of the console image (entrypoint, healthcheck script, as uid 10001),
#                  then "Installation < 15 min" (ROADMAP phase 7): a fresh console + agent install on
#                  the runner following deploy/README.md, timed up to the agent's first heartbeat
#                  (deploy/install-test.sh), then a check of the service's socket restrictions.
# Called by ci.yml (pull requests and pushes that touch packaging: builds everything from the
# checkout) and by publish.yml (release tags: the published console image, pinned by digest, and
# the .deb files built from the signed agent image, uploaded by publish.yml as artifacts).

on:
  workflow_call:
    inputs:
      build-deb:
        description: Build the .deb from the checkout (false = use the deb-<arch> artifacts of the calling run)
        type: boolean
        default: true
      published-images:
        description: Install test with the console image published by the calling run (image-console artifact) instead of a local build
        type: boolean
        default: false
      expected-version:
        description: Version `databastion-agent --version` must print (empty = the agent/Cargo.toml version, `any` = no check)
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_IMAGE: debian:12@sha256:f37a335e82bca302e955fa39f9dfe28f1be618f016f8a2b56318e5a5111afc26
  UBUNTU_IMAGE: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3

jobs:
  publish-dry-run:
    name: Publish build path, no push (${{ matrix.image }})
    if: inputs.build-deb || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        image: [console, agent]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Keep in sync with the `build` job of publish.yml (only the output differs).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.title=databastion-${{ matrix.image }}
            org.opencontainers.image.version=0.0.0-dry-run
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          provenance: mode=max
          sbom: true
          no-cache: true
          pull: true
      - name: The index carries the SBOM and provenance attestations
        run: |
          mkdir -p "$RUNNER_TEMP/oci"
          tar -xf "$RUNNER_TEMP/image.tar" -C "$RUNNER_TEMP/oci"
          cd "$RUNNER_TEMP/oci"
          index="$(jq -r '.manifests[0].digest' index.json)"
          jq . "blobs/sha256/${index#sha256:}"
          att="$(jq -r '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | .[0].digest // empty' "blobs/sha256/${index#sha256:}")"
          [ -n "$att" ] || { echo "::error::no attestation manifest in the index"; exit 1; }
          types="$(jq -r '[.layers[].annotations["in-toto.io/predicate-type"]] | join(" ")' "blobs/sha256/${att#sha256:}")"
          echo "attestations: $types"
          grep -q 'spdx' <<<"$types" || { echo "::error::no SBOM attestation"; exit 1; }
          grep -q 'slsa.dev/provenance' <<<"$types" || { echo "::error::no provenance attestation"; exit 1; }

  deb:
    name: Build .deb (${{ matrix.arch }})
    if: inputs.build-deb || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Same Dockerfile, context and pinned toolchain as the published image. The CI cache is
      # allowed here (not a release build: publish.yml uses no cache).
      - name: Build the agent image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: agent
          file: agent/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: databastion-agent:packaging
          cache-from: type=gha,scope=packaging-agent-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=packaging-agent-${{ matrix.arch }}
      - name: Copy the binary out of the image
        run: |
          id="$(docker create databastion-agent:packaging)"
          docker cp "$id:/usr/local/bin/databastion-agent" "$RUNNER_TEMP/databastion-agent"
          docker rm "$id" >/dev/null
          "$RUNNER_TEMP/databastion-agent" --version
      - name: Install nfpm (pinned, checksum database verified)
        run: |
          nfpm="$(deploy/deb/install-nfpm.sh "$RUNNER_TEMP/bin")"
          echo "NFPM=$nfpm" >> "$GITHUB_ENV"
      - name: Build the .deb twice (reproducible)
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' agent/Cargo.toml)"
          deb="$(deploy/deb/build.sh --binary "$RUNNER_TEMP/databastion-agent" --arch "$ARCH" \
            --version "$version" --out "$RUNNER_TEMP/deb")"
          again="$(deploy/deb/build.sh --binary "$RUNNER_TEMP/databastion-agent" --arch "$ARCH" \
            --version "$version" --out "$RUNNER_TEMP/deb-again")"
          sha256sum "$deb" "$again"
          cmp "$deb" "$again"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: ${{ runner.temp }}/deb/*.deb
          if-no-files-found: error
          retention-days: 7

  # Security review F1 of the Firebird lot: the connector's bare-host identity files must load under
  # the unit's filter, which answers openat2 with ENOSYS (RestrictSUIDSGID=yes). No production
  # entry point runs a Firebird check without an enrolled identity and a console, so the check runs
  # the connector's own test binary (it::unit, prepare and check phases) under the unit. Built from
  # the checkout in both modes (pull requests and publish.yml), in the builder image of
  # agent/Dockerfile (glibc 2.36: runs on Debian 12 and Ubuntu 24.04), exactly the lock file.
  firebird-unit-bin:
    name: Firebird unit-check test binary (${{ matrix.arch }})
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the connector's library test binary in the agent builder image
        run: |
          builder="$(sed -n 's/^FROM \(rust:[^ ]*\) AS build$/\1/p' agent/Dockerfile)"
          [ -n "$builder" ] || { echo "::error::no builder image in agent/Dockerfile"; exit 1; }
          mkdir -p "$RUNNER_TEMP/target" "$RUNNER_TEMP/fbtest"
          timeout 1500 docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/target:/target" \
            -e CARGO_TARGET_DIR=/target -e CARGO_PROFILE_TEST_DEBUG=0 -w /src/agent "$builder" \
            cargo test --locked -p databastion-connector-firebird --lib --no-run --message-format=json \
            >"$RUNNER_TEMP/build.json"
          exe="$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "databastion_connector_firebird" and .profile.test and .executable != null) | .executable' "$RUNNER_TEMP/build.json")"
          [ -n "$exe" ] && [ "$(wc -l <<<"$exe")" = 1 ] || { echo "::error::test binary not found: '${exe}'"; exit 1; }
          install -m 0755 "$RUNNER_TEMP/target/${exe#/target/}" "$RUNNER_TEMP/fbtest/fbtest"
          ls -l "$RUNNER_TEMP/fbtest/fbtest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firebird-unit-check-${{ matrix.arch }}
          path: ${{ runner.temp }}/fbtest/fbtest
          if-no-files-found: error
          retention-days: 1

  deb-install:
    name: Install .deb (${{ matrix.distro }}, ${{ matrix.arch }})
    needs: [deb, firebird-unit-bin]
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        distro: [debian-12, ubuntu-24.04]
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: ${{ runner.temp }}/deb
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firebird-unit-check-${{ matrix.arch }}
          path: ${{ runner.temp }}/fbtest
      - name: dpkg -i in a fresh container, checks, upgrade, remove, purge
        env:
          DISTRO: ${{ matrix.distro }}
          EXPECTED: ${{ inputs.expected-version }}
        run: |
          image="$DEBIAN_IMAGE"; [ "$DISTRO" = ubuntu-24.04 ] && image="$UBUNTU_IMAGE"
          if [ -z "$EXPECTED" ]; then
            EXPECTED="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' agent/Cargo.toml)"
          elif [ "$EXPECTED" = any ]; then
            EXPECTED=""
          fi
          deb="$(cd "$RUNNER_TEMP/deb" && ls -- *.deb)"
          docker run --rm -v "$PWD/deploy/deb:/test:ro" -v "$RUNNER_TEMP/deb:/deb:ro" "$image" \
            /test/test-install.sh "/deb/$deb" "$EXPECTED"
      # ROADMAP P10-A: the SQLite reader under the unit's own sandbox (e2e/sqlite-unit.sh). A
      # throwaway privileged container of the same pinned image with systemd as PID 1 (Debian 12:
      # systemd 252; Ubuntu 24.04: 255; the runner's kernel). The script installs the .deb and starts
      # databastion-agent.service itself, ExecStart, Restart and the output redirection replaced by a
      # drop-in under /run
      # with the agent's stand-in (e2e/sqlite_unit_driver.py), every other property of the shipped
      # unit kept: the reader must apply Landlock and its seccomp filter on top of the unit's, read a
      # seeded file and exit 0. --privileged is for systemd as PID 1 (it turns Docker's seccomp
      # profile off: Docker's default profile is the e2e-sqlite job's). No secret, no console.
      # The test image's apt packages (systemd, systemd-sysv, python3) are not pinned to versions,
      # as in deploy/deb/test-install.sh: the base image is pinned by digest, apt verifies the
      # archive signatures, and the distribution archives drop superseded versions (a security
      # update would break a pinned version on a release run, publish.yml included). They are the
      # test harness only: nothing from them goes into the .deb under test or any release asset.
      - name: SQLite reader under the unit's own SystemCallFilter (systemd as PID 1)
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          image="$DEBIAN_IMAGE"; [ "$DISTRO" = ubuntu-24.04 ] && image="$UBUNTU_IMAGE"
          deb="$(cd "$RUNNER_TEMP/deb" && ls -- *.deb)"
          docker version --format 'Docker {{.Server.Version}}'
          printf '%s\n' "FROM $image" \
            "RUN apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends systemd systemd-sysv python3 >/dev/null && rm -rf /var/lib/apt/lists/*" \
            "STOPSIGNAL SIGRTMIN+3" 'CMD ["/sbin/init"]' \
            | timeout 600 docker build -q -t "databastion-deb-systemd:$DISTRO" -
          docker run -d --name "databastion-deb-systemd-$DISTRO" --privileged --cgroupns=private \
            --tmpfs /run --tmpfs /run/lock -e container=docker \
            -v "$PWD/e2e:/test:ro" -v "$RUNNER_TEMP/deb:/deb:ro" -v "$RUNNER_TEMP/fbtest:/fbtest:ro" \
            "databastion-deb-systemd:$DISTRO" >/dev/null
          timeout 300 docker exec "databastion-deb-systemd-$DISTRO" /test/sqlite-unit.sh "/deb/$deb"
      # Security review F1 of the Firebird lot (e2e/firebird-unit.sh), in the same container, the .deb
      # installed by the step above: under the shipped unit (openat2 answers ENOSYS), the host's own
      # /etc identity files load, the readers check of a seeded log in the user guide's ACL layout
      # passes, and the link rules hold. The connector's test binary runs as the unit's ExecStart.
      - name: Firebird bare-host identity files under the unit's own SystemCallFilter (systemd as PID 1)
        env:
          DISTRO: ${{ matrix.distro }}
        run: timeout 300 docker exec "databastion-deb-systemd-$DISTRO" /test/firebird-unit.sh /fbtest/fbtest
      - name: Remove the systemd container
        if: always()
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          docker rm -f "databastion-deb-systemd-$DISTRO" >/dev/null 2>&1 || true
          docker rmi "databastion-deb-systemd:$DISTRO" >/dev/null 2>&1 || true

  install-test:
    name: Installation < 15 min (console + agent .deb)
    needs: deb
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read   # release mode: pull the published console image even before it is public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-amd64
          path: ${{ runner.temp }}/deb
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: ${{ !inputs.published-images }}
      # Pull requests: the console image of the checkout, built before the clock starts (a user pulls
      # the published image instead; release runs time that pull).
      - name: Build the console image
        if: ${{ !inputs.published-images }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: console
          file: console/Dockerfile
          platforms: linux/amd64
          load: true
          tags: databastion-console:install-test
          cache-from: type=gha,scope=packaging-console-amd64
          cache-to: type=gha,mode=max,scope=packaging-console-amd64
      # Releases: the published console image, pinned by the digest publish.yml signed and verified
      # (the form deploy/README.md requires in .env).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ inputs.published-images }}
        with:
          name: image-console
          path: ${{ runner.temp }}/ref
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: ${{ inputs.published-images }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Console image to test
        env:
          PUBLISHED: ${{ inputs.published-images }}
        run: |
          if [ "$PUBLISHED" = true ]; then
            echo "CONSOLE_IMAGE=$(cat "$RUNNER_TEMP/ref/image-console.txt")" >> "$GITHUB_ENV"
          else
            echo "CONSOLE_IMAGE=databastion-console:install-test" >> "$GITHUB_ENV"
          fi
      # Seconds, before the install: the image's entrypoint and healthcheck scripts load and run as
      # the image's user (uid 10001), with no shell in the image. Pull requests only: on releases a
      # pull here would leave the image cached and shorten the timed install.
      - name: Console image smoke test
        if: ${{ !inputs.published-images }}
        run: deploy/console-image-smoke.sh "$CONSOLE_IMAGE"
      - name: Tool versions
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version
          systemctl --version | head -n 1
      - name: Run deploy/install-test.sh
        run: |
          AGENT_DEB="$(ls "$RUNNER_TEMP"/deb/*.deb)"
          export AGENT_DEB
          deploy/install-test.sh
