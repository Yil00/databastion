name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: Titre Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            security
            revert
            docs
            refactor
            test
            ci
            chore
            build
            release

  dco:
    name: DCO (Signed-off-by)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Chaque commit est signé DCO
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an' "$c")
            case "$author" in *"[bot]") continue ;; esac
            if ! git log -1 --format='%B' "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit ${c:0:12} ($author) sans ligne Signed-off-by. Utiliser 'git commit -s' (voir CONTRIBUTING.md)."
              fail=1
            fi
          done
          exit $fail
