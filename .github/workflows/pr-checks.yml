name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            security
            revert
            docs
            refactor
            test
            ci
            chore
            build
            release

  dco:
    name: DCO (Signed-off-by)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Every commit is DCO signed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an' "$c")
            case "$author" in *"[bot]") continue ;; esac
            if ! git log -1 --format='%B' "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit ${c:0:12} ($author) has no Signed-off-by line. Use 'git commit -s' (see CONTRIBUTING.md)."
              fail=1
            fi
          done
          exit $fail

  # PRs to main only: shows the version release.yml will compute when the PR is merged, and fails
  # when the title does not name it. release-it derives the version from the commits since the
  # latest tag (a `feat` commit gives a minor version, only `fix` commits a patch version), so a
  # title written by hand can be wrong: 0.2.0 was planned as 0.1.1 (ROADMAP v0.1.x item (k)).
  # No token: the GitHub release step is turned off and nothing is pushed.
  # Advisory only: the PR's own code runs here (.release-it.json hooks, npm ci), so keep the
  # `pull_request` trigger and no secrets, and never feed this result to a privileged workflow.
  release-version:
    name: Release version
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The PR merge commit (refs/pull/N/merge): what main will look like after the merge.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Version release-it will compute
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          git fetch --force --tags --quiet origin
          # release-it requires the branch main (.release-it.json); a local branch at the merge commit.
          git checkout --quiet -B main
          version="$(npx release-it --ci --release-version --no-github.release --no-git.requireUpstream)"
          # The whole output must be one version: nothing else reaches the summary or a workflow command.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release-it did not print a single version (raw output in the log above)."
            printf '%q\n' "$version"
            exit 1
          fi
          echo "### Release version: \`$version\`" >> "$GITHUB_STEP_SUMMARY"
          case "$TITLE" in
            *"[skip-release]"*)
              echo "::notice::[skip-release] in the title: no release (it would be $version)."
              exit 0 ;;
          esac
          # release.yml fails without curated notes (scripts/changelog-release.mjs): say it here first.
          if ! node scripts/changelog-release.mjs check; then
            echo "::error::Merging this PR would fail the release: CHANGELOG.md has no curated notes under \"## Unreleased\" (RELEASE.md, section 5)."
            exit 1
          fi
          expected="release: $version"
          if [ "$TITLE" != "$expected" ]; then
            echo "::error::Merging this PR releases $version: title it \"$expected\", or add [skip-release] to the title to merge without a release (RELEASE.md, section 5)."
            exit 1
          fi
          echo "::notice::Merging this PR releases $version."
      # RELEASE.md sections 7 and 8: the holdout seed is rotated once per release (it was not for
      # 0.2.0, 0.3.0 and 0.3.1). Fails unless SEED in dev/holdout/generate.py at the merge commit
      # differs from SEED at the previous final release tag (the latest X.Y.Z tag reachable from the
      # PR base) and from every earlier final release. `[skip-release]` in the title: no release, no
      # check. `[skip-holdout]`: the release keeps the seed, accepted only when nothing under
      # agent/crates/classifiers changed since that tag (RELEASE.md section 8). A reminder, not a
      # control: the PR's own code runs here and can edit this step.
      - name: Holdout seed rotated since the previous release
        if: ${{ !cancelled() }}
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$TITLE" in
            *"[skip-release]"*)
              echo "::notice::[skip-release] in the title: no release, no holdout seed check."
              exit 0 ;;
          esac
          git fetch --force --tags --quiet origin
          # SEED of dev/holdout/generate.py at a commit or tag; empty when absent or unreadable.
          seed_at() {
            git show "$1:dev/holdout/generate.py" 2>/dev/null \
              | sed -nE 's/^SEED[[:space:]]*=[[:space:]]*([0-9][0-9_]*)[[:space:]]*(#.*)?$/\1/p' \
              | tr -d '_' || true
          }
          new="$(seed_at HEAD)"
          if [[ ! "$new" =~ ^[0-9]+$ ]]; then
            echo "::error::Cannot read a single SEED = <digits> line from dev/holdout/generate.py."
            exit 1
          fi
          prev_tag="$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' "$BASE" 2>/dev/null || true)"
          if [ -z "$prev_tag" ]; then
            echo "::notice::No previous final release tag: nothing to compare the holdout seed with."
            exit 0
          fi
          prev="$(seed_at "$prev_tag")"
          if [ "$new" != "$prev" ]; then
            # A rotation must not bring back the seed of an earlier release.
            reused=""
            for t in $(git tag --list '[0-9]*.[0-9]*.[0-9]*' --merged "$BASE"); do
              case "$t" in *-*) continue ;; esac
              if [ "$(seed_at "$t")" = "$new" ]; then reused="$reused $t"; fi
            done
            if [ -n "$reused" ]; then
              echo "::error::The holdout seed $new was already used by release(s)$reused: pick a new seed (RELEASE.md, section 8)."
              exit 1
            fi
            echo "::notice::Holdout seed rotated since $prev_tag ($prev -> $new)."
            exit 0
          fi
          case "$TITLE" in
            *"[skip-holdout]"*)
              if git diff --quiet "$prev_tag" HEAD -- agent/crates/classifiers; then
                echo "::warning::[skip-holdout]: this release keeps the holdout seed of $prev_tag; no classifier change since $prev_tag. Say why in the PR description (RELEASE.md, section 8)."
                exit 0
              fi
              echo "::error::[skip-holdout] refused: agent/crates/classifiers changed since $prev_tag. Rotate the holdout seed on dev first (RELEASE.md, section 8)."
              exit 1 ;;
          esac
          echo "::error::The holdout seed ($new) is the one of $prev_tag: rotate it on dev before this release PR (RELEASE.md, sections 7 and 8), or add [skip-holdout] to the title if the release has no classifier change (section 8)."
          exit 1
