name: E2E

# End-to-end enrollment / revocation in containers (phase 1 exit criterion) and invariant I2 test
# (P2-E: Discovery scan of the seeded target, no ground-truth value in clear text in the console
# database, the logs or the findings page), see e2e/README.md.
# Not required by the "CI result" gate yet.

on:
  push:
    branches: [main, dev]
    paths: ["agent/**", "console/**", "shared/**", "e2e/**", "deploy/**", "dev/seed/out/postgres.sql", "dev/ground-truth.json", ".github/workflows/e2e.yml"]
  pull_request:
    branches: [main, dev]
    paths: ["agent/**", "console/**", "shared/**", "e2e/**", "deploy/**", "dev/seed/out/postgres.sql", "dev/ground-truth.json", ".github/workflows/e2e.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enrollment:
    name: Enrollment and revocation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_LOG_DIR: ${{ github.workspace }}/e2e-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tool versions
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version
          openssl version
          python3 --version
      - name: Unit tests of the I2 leak scanner
        run: timeout 120 python3 -m unittest discover -s e2e -p 'test_*.py' -v
      - name: Run e2e/run.sh
        run: e2e/run.sh
      # run.sh redacts every generated secret from the logs on exit, whatever the result (and
      # masks them in the job log); the secrets are random, for this run only, and destroyed
      # with the containers. If the invariant I2 check fails, the logs may hold seeded values:
      # they are fake (dev/seed/generate.py) and already public in the repository; the job log
      # itself only holds needle ids and file names.
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: e2e-logs/
          retention-days: 7
          if-no-files-found: ignore
