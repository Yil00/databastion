# DataBastion dev environment. Start with `make dev` from the repository root; see dev/README.md.
# - Every port is published on 127.0.0.1 only.
# - Credentials come from dev/.env (copy of dev/.env.example): dev-only values.
# - Images are pinned by tag AND index digest (multi-arch).
# - Engine logs used by Audit are written under dev/.state/logs/ (git-ignored). `make dev` creates
#   those directories world-writable first, so the engines' non-root users can write to them; if you
#   run `docker compose` directly, run `make dev-dirs` before.
# - Engine versions: the DATABASTION_DEV_*_IMAGE variables override the PostgreSQL base image and
#   the MySQL, MariaDB and MongoDB images (tag AND digest); unset, the pinned values below are used.
#   The engine-matrix workflow (.github/workflows/engine-matrix.yml) sets them; see dev/README.md.
name: databastion-dev

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 60
  start_period: 20s

services:
  postgres:
    build:
      context: ./postgres
      args:
        # Base image of dev/postgres/Dockerfile; the pgaudit package follows its PG_MAJOR.
        PG_IMAGE: ${DATABASTION_DEV_POSTGRES_IMAGE:-postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652}
    image: databastion-dev/postgres:${DATABASTION_DEV_POSTGRES_TAG:-17.11}-pgaudit
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?copy dev/.env.example to dev/.env}
      POSTGRES_DB: shop
      DATABASTION_DB_PASSWORD: ${DATABASTION_DB_PASSWORD:?copy dev/.env.example to dev/.env}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pgaudit,pg_stat_statements
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - logging_collector=on
      # jsonlog needs PostgreSQL 15+: set DATABASTION_DEV_POSTGRES_LOG_FORMAT=csvlog for 14
      # (the file is then postgresql.csv instead of postgresql.json).
      - -c
      - log_destination=${DATABASTION_DEV_POSTGRES_LOG_FORMAT:-jsonlog}
      - -c
      - log_directory=/var/log/databastion
      - -c
      - log_filename=postgresql.log
      # Dev-only convenience (logs readable from the host through the bind mount); production uses
      # 0640 plus an ACL for the agent's OS user on log_directory only (ADR-0012).
      - -c
      - log_file_mode=0644
      # pgaudit: nothing server-wide; `read, write` on the `shop` database (ALTER DATABASE in
      # initdb/20-databastion.sh) and object audit of the seeded tables via databastion_auditor.
      - -c
      - pgaudit.log=none
      - -c
      - pgaudit.role=databastion_auditor
      - -c
      - pgaudit.log_relation=on
      - -c
      - pgaudit.log_catalog=off
      - -c
      - pgaudit.log_parameter=off
      # Rows per statement in the pgaudit records (P4-A: volume of each access, Full level). pgaudit
      # 1.6+ (PostgreSQL 14+); on 13 it is a placeholder that the connector does not count.
      - -c
      - pgaudit.log_rows=on
      - -c
      - pg_stat_statements.track=all
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./.state/logs/postgres:/var/log/databastion
      - ./seed/out/postgres.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
      - ./postgres/initdb/20-databastion.sh:/docker-entrypoint-initdb.d/20-databastion.sh:ro
    healthcheck:
      # TCP only: the temporary server used during initialization listens on the Unix socket only,
      # so the service becomes healthy after seeding.
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U databastion -d shop"]
      <<: *healthcheck

  mariadb:
    image: ${DATABASTION_DEV_MARIADB_IMAGE:-mariadb:11.4.13@sha256:70cc072b29b4a89ae07abb2d4da2c64678a7f2dfe092751bb51c87d67dc1338b}
    # Creates the dev-only TLS material before any server starts (mariadb/tls-entrypoint.sh), then
    # runs the image's entrypoint. An entrypoint override drops the image's CMD: set it again.
    entrypoint: ["/bin/bash", "/usr/local/bin/databastion-tls-entrypoint.sh"]
    command: ["mariadbd"]
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?copy dev/.env.example to dev/.env}
      DATABASTION_DB_PASSWORD: ${DATABASTION_DB_PASSWORD:?copy dev/.env.example to dev/.env}
      # Dev-only convenience: files the server creates are 0644, so that the server_audit log is
      # readable from the host through the bind mount (P4-B Audit tests); production keeps the
      # default and gives the agent's OS user read access on the log directory only.
      UMASK: "0644"
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3307}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      # Dev-only TLS material (mariadb/tls-entrypoint.sh), outside the datadir: the CA stays the
      # same across restarts until `down -v`.
      - mariadb-tls:/var/lib/databastion-tls
      - ./.state/logs/mariadb:/var/log/databastion
      - ./mariadb/databastion.cnf:/etc/mysql/conf.d/databastion.cnf:ro
      - ./seed/out/mariadb.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
      - ./mariadb/initdb/20-databastion.sh:/docker-entrypoint-initdb.d/20-databastion.sh:ro
      - ./mariadb/tls-entrypoint.sh:/usr/local/bin/databastion-tls-entrypoint.sh:ro
    healthcheck:
      # --connect fails while the entrypoint's temporary (--skip-networking) server is seeding.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      <<: *healthcheck

  mysql:
    image: ${DATABASTION_DEV_MYSQL_IMAGE:-mysql:8.4.11@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copy dev/.env.example to dev/.env}
      DATABASTION_DB_PASSWORD: ${DATABASTION_DB_PASSWORD:?copy dev/.env.example to dev/.env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/databastion.cnf:/etc/mysql/conf.d/databastion.cnf:ro
      - ./seed/out/mysql.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
      - ./mysql/initdb/20-databastion.sh:/docker-entrypoint-initdb.d/20-databastion.sh:ro
      - ./mysql/initdb/30-tls.sh:/docker-entrypoint-initdb.d/30-tls.sh:ro
    healthcheck:
      # TCP: the temporary server used during initialization runs with --skip-networking.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$DATABASTION_DB_PASSWORD\" mysql -h 127.0.0.1 -u databastion -N -e 'SELECT 1 FROM hr.employees LIMIT 1'"]
      <<: *healthcheck

  # Percona Server for MySQL 8.4 with the audit_log_filter component writing JSON (P4-B: the
  # `audit_log` Audit source). Same seed and TLS material as the MySQL service; its own agent
  # account (initdb/20-databastion.sh).
  percona:
    image: percona/percona-server:8.4.11-11@sha256:6a1df7b77d253f878d255b4d40f9c32c429d0cc380269487ff08f18e7366dcd8
    environment:
      MYSQL_ROOT_PASSWORD: ${PERCONA_ROOT_PASSWORD:?copy dev/.env.example to dev/.env}
      DATABASTION_DB_PASSWORD: ${DATABASTION_DB_PASSWORD:?copy dev/.env.example to dev/.env}
      # Dev-only convenience: the audit log is created 0644, readable from the host through the
      # bind mount; production gives the agent's OS user read access on the log directory only.
      UMASK: "0644"
    ports:
      - "127.0.0.1:${PERCONA_PORT:-3308}:3306"
    volumes:
      - percona-data:/var/lib/mysql
      - ./.state/logs/percona:/var/log/databastion
      - ./percona/databastion.cnf:/etc/my.cnf.d/databastion.cnf:ro
      - ./seed/out/mysql.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
      - ./percona/initdb/20-databastion.sh:/docker-entrypoint-initdb.d/20-databastion.sh:ro
      - ./mysql/initdb/30-tls.sh:/docker-entrypoint-initdb.d/30-tls.sh:ro
    healthcheck:
      # root@localhost on the socket (excluded from the audit log by a log_none filter), then a bare
      # TCP connect (no login, so no audit record): TCP is only open once the entrypoint's
      # temporary server (--skip-networking) has stopped.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -u root -N -e 'SELECT 1 FROM hr.employees LIMIT 1' && bash -c 'exec 3<>/dev/tcp/127.0.0.1/3306'"]
      <<: *healthcheck

  mongo:
    image: ${DATABASTION_DEV_MONGO_IMAGE:-mongo:8.0.32@sha256:4968f22d0c6c10ef29952f3e807f62872ba22b3312f25803564fbfc08255efc2}
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?copy dev/.env.example to dev/.env}
      DATABASTION_DB_PASSWORD: ${DATABASTION_DB_PASSWORD:?copy dev/.env.example to dev/.env}
    # Community edition: no audit log. Profiler level 1 + structured JSON log (ADR-0027: Limited).
    command:
      - mongod
      - --profile
      - "1"
      - --slowms
      - "${MONGO_SLOWMS:-0}"
      - --logpath
      - /var/log/databastion/mongod.log
      - --logappend
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ./.state/logs/mongodb:/var/log/databastion
      - ./seed/out/mongo.json:/seed/mongo.json:ro
      - ./mongo/initdb/10-seed.js:/docker-entrypoint-initdb.d/10-seed.js:ro
    healthcheck:
      # Healthy only once the final server runs with --auth (the init server runs without it) and
      # the agent account exists. getCmdLineOpts needs a cluster privilege that the agent account
      # does not hold (ADR-0026): the administrator runs it.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --norc "mongodb://root:$$MONGO_INITDB_ROOT_PASSWORD@127.0.0.1:27017/admin"
          --eval 'if (!db.adminCommand({getCmdLineOpts: 1}).argv.includes("--auth")) quit(1)'
          && mongosh --quiet --norc "mongodb://databastion:$$DATABASTION_DB_PASSWORD@127.0.0.1:27017/app?authSource=admin"
          --eval 'db.runCommand({ping: 1})'
      <<: *healthcheck

  # Percona Server for MongoDB (phase 7): the auditLog source (JSON file, successful authorization
  # checks included) against a real server. Opt-in (profile `psmdb`): name the service to start it,
  # `docker compose -f dev/docker-compose.yml up -d psmdb`. Same seed and ADR-0026 account as `mongo`.
  psmdb:
    image: percona/percona-server-mongodb:8.0.32-14@sha256:5ba5f240d2dc98bc6236ab1d79c0862c4b62dba9d98cd0ffdf716c30473d2d11
    profiles: [psmdb]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?copy dev/.env.example to dev/.env}
      DATABASTION_DB_PASSWORD: ${DATABASTION_DB_PASSWORD:?copy dev/.env.example to dev/.env}
    command:
      - mongod
      - --auditDestination
      - file
      - --auditFormat
      - JSON
      - --auditPath
      - /var/log/databastion/auditLog.json
      - --setParameter
      - auditAuthorizationSuccess=true
    ports:
      - "127.0.0.1:${PSMDB_PORT:-27019}:27017"
    volumes:
      - psmdb-data:/data/db
      - ./.state/logs/psmdb:/var/log/databastion
      - ./seed/out/mongo.json:/seed/mongo.json:ro
      - ./mongo/initdb/10-seed.js:/docker-entrypoint-initdb.d/10-seed.js:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --norc "mongodb://root:$$MONGO_INITDB_ROOT_PASSWORD@127.0.0.1:27017/admin"
          --eval 'if (!db.adminCommand({getCmdLineOpts: 1}).argv.includes("--auth")) quit(1)'
          && mongosh --quiet --norc "mongodb://databastion:$$DATABASTION_DB_PASSWORD@127.0.0.1:27017/app?authSource=admin"
          --eval 'db.runCommand({ping: 1})'
      <<: *healthcheck

  openldap:
    build: ./openldap
    image: databastion-dev/openldap:bookworm-20260918
    environment:
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?copy dev/.env.example to dev/.env}
      DATABASTION_DB_PASSWORD: ${DATABASTION_DB_PASSWORD:?copy dev/.env.example to dev/.env}
    ports:
      - "127.0.0.1:${LDAP_PORT:-1389}:389"
      - "127.0.0.1:${LDAPS_PORT:-1636}:636"
    volumes:
      - openldap-config:/etc/ldap/slapd.d
      - openldap-data:/var/lib/ldap
      - ./seed/out/openldap.ldif:/seed/openldap.ldif:ro
    healthcheck:
      # ldapi + EXTERNAL on cn=config: does not touch the audited tree, so no cn=accesslog noise.
      test: ["CMD", "ldapsearch", "-Q", "-Y", "EXTERNAL", "-H", "ldapi:///", "-b", "cn=config", "-s", "base", "-LLL", "dn"]
      <<: *healthcheck

  # Keycloak (phase 8, P8-D): OpenID Connect provider for the console's OIDC login (ADR-0038
  # decision 17), with the seeded realm keycloak/databastion-realm.json. Opt-in (profile
  # `keycloak`): `make dev-keycloak`. Dev mode (`start-dev`: embedded H2, HTTP), no volume: the realm
  # is imported again in every new container, so `make dev-down` discards any edit made in it.
  # Plain HTTP on a loopback address is what ADR-0038 decision 2 allows outside production. The
  # issuer is http://127.0.0.1:<port>/realms/databastion (KC_HOSTNAME): another site than the
  # console on http://localhost:3000, so the login is a cross-site navigation, as in production.
  # Credentials: dev/.env. Unlike the other services, they fall back to the DEV-ONLY values of
  # .env.example, so that a dev/.env copied before this service keeps `make dev` working (Compose
  # interpolates the services of inactive profiles too).
  keycloak:
    image: ${DATABASTION_DEV_KEYCLOAK_IMAGE:-keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741}
    profiles: [keycloak]
    command: ["start-dev", "--import-realm"]
    environment:
      # Temporary administrator of the master realm (admin console, admin API of the smoke test).
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-dev-only-keycloak-admin}
      # Placeholders of the realm file, resolved at import time.
      KEYCLOAK_CONSOLE_CLIENT_SECRET: ${KEYCLOAK_CONSOLE_CLIENT_SECRET:-dev-only-keycloak-console-client-secret}
      KEYCLOAK_DEV_USER_PASSWORD: ${KEYCLOAK_DEV_USER_PASSWORD:-dev-only-keycloak-user}
      KC_HOSTNAME: http://127.0.0.1:${KEYCLOAK_PORT:-8180}
      KC_HEALTH_ENABLED: "true"
    ports:
      # The management interface (9000: health) is not published; the healthcheck reads it inside.
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak/databastion-realm.json:/opt/keycloak/data/import/databastion-realm.json:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # The image has no curl or wget: an HTTP/1.0 request in bash on the management port.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && IFS= read -r status <&3
          && [[ $$status == *' 200 '* ]]
      <<: *healthcheck
      start_period: 60s

  # Apereo CAS 8.0 (phase 8, P8-D): the target of the CAS connector (ADR-0041 decision 14), with a
  # JSON service registry (cas/services, generated by seed/generate.py), static fake users, the
  # JSON audit trail in .state/logs/cas/cas_audit.log and a JPA ticket registry in the `postgres`
  # service (database `cas`). Opt-in (profile `cas`): `make dev-cas`. The image is built by
  # cas/Dockerfile: the published apereo/cas image lacks those modules, so the build adds them to
  # its war from locked, checksum-verified sources (ADR-0041 open question 7). Plain HTTP on a
  # loopback port, as Keycloak: the agent never contacts CAS. Credentials fall back to the DEV-ONLY
  # values of .env.example, as Keycloak's. Files get ADR-0041 decision 6 permissions from
  # cas-files-init: owner the CAS user (10041), group the agent's (10001), so an agent running as
  # uid 10001 (the agent image, e2e) can read them and not write them; the host user cannot read
  # them either (dev/README.md "Apereo CAS").
  cas-files-init:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    profiles: [cas]
    user: "0:0"
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, FSETID]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASTION_DEV_AGENT_GID: ${DATABASTION_DEV_AGENT_GID:-10001}
    command: ["sh", "/usr/local/bin/files-init.sh", "setup"]
    volumes:
      - ./cas/files-init.sh:/usr/local/bin/files-init.sh:ro
      - ./cas/services:/src/services:ro
      # Only the CAS parts of .state (`make dev-dirs` creates both), not the metrics token.
      - ./.state/cas:/state/cas
      - ./.state/logs:/state/logs
    restart: "no"

  # Role and database `cas` in the dev PostgreSQL (cas/db-init.sh). The client image is the
  # pinned PostgreSQL 17 one whatever DATABASTION_DEV_POSTGRES_IMAGE says (psql 15+ needed).
  cas-db-init:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    profiles: [cas]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?copy dev/.env.example to dev/.env}
      DEV_CAS_DB_PASSWORD: ${CAS_DB_PASSWORD:-dev-only-cas-db}
    entrypoint: ["sh", "/usr/local/bin/db-init.sh"]
    command: ["init"]
    volumes:
      - ./cas/db-init.sh:/usr/local/bin/db-init.sh:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  cas:
    build: ./cas
    image: databastion-dev/cas:8.0.2-overlay
    profiles: [cas]
    depends_on:
      postgres: { condition: service_healthy }
      cas-files-init: { condition: service_completed_successfully }
      cas-db-init: { condition: service_completed_successfully }
    environment:
      DEV_CAS_SERVER_NAME: http://127.0.0.1:${CAS_PORT:-8280}
      DEV_CAS_USER_PASSWORD: ${CAS_DEV_USER_PASSWORD:-dev-only-cas-user}
      DEV_CAS_DB_PASSWORD: ${CAS_DB_PASSWORD:-dev-only-cas-db}
      DEV_CAS_TICKET_CRYPTO: ${DATABASTION_DEV_CAS_TICKET_CRYPTO:-true}
      # The mounted cas/config/log4j2.xml (audit trail to /var/log/cas), not the bundled one.
      LOGGING_CONFIG: file:/etc/cas/config/log4j2.xml
      JVM_MEM_OPTS: -Xms256m -Xmx1g
    ports:
      - "127.0.0.1:${CAS_PORT:-8280}:8080"
    volumes:
      - ./cas/config/cas.properties:/etc/cas/config/cas.properties:ro
      - ./cas/config/log4j2.xml:/etc/cas/config/log4j2.xml:ro
      - ./.state/cas/services:/etc/cas/services:ro
      - ./.state/logs/cas:/var/log/cas
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # No curl or wget in the image: an HTTP/1.0 request in bash for a static resource, served
      # once the application context (registry included) is up. Not /cas/login: every request to
      # the login page writes an audit record. No actuator endpoint is exposed.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /cas/images/cas-logo.png HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && IFS= read -r status <&3
          && [[ $$status == *' 200 '* ]]
      <<: *healthcheck
      start_period: 120s

  # The agent's column grants on the ticket table CAS created at start (cas/db-init.sh grants).
  cas-db-grants:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    profiles: [cas]
    depends_on:
      cas: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?copy dev/.env.example to dev/.env}
    entrypoint: ["sh", "/usr/local/bin/db-init.sh"]
    command: ["grants"]
    volumes:
      - ./cas/db-init.sh:/usr/local/bin/db-init.sh:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      <<: *healthcheck

  # One-shot: copies the host metrics token (dev/.state/metrics_token, 0600, owned by the host user)
  # into the prometheus-secrets volume, owned by Prometheus' user (65534) with mode 0400, so that
  # Prometheus itself keeps running as non-root. Minimal capabilities, no network.
  metrics-token-init:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    user: "0:0"
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, FOWNER]
    security_opt: ["no-new-privileges:true"]
    command:
      - sh
      - -euc
      - |
        test -s /run/token-src/metrics_token
        rm -f /secrets/metrics_token
        install -o 65534 -g 65534 -m 0400 /run/token-src/metrics_token /secrets/metrics_token
    volumes:
      - ./.state/metrics_token:/run/token-src/metrics_token:ro
      - prometheus-secrets:/secrets
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    depends_on:
      metrics-token-init: { condition: service_completed_successfully }
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      <<: *healthcheck

  grafana:
    image: grafana/grafana:12.4.11@sha256:3ea272e5cab64a4a62240c682e2c62433b25614d956d44c299a10cb6994f6f2e
    depends_on:
      prometheus: { condition: service_healthy }
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?copy dev/.env.example to dev/.env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      <<: *healthcheck

volumes:
  postgres-data:
  mariadb-data:
  mariadb-tls:
  mysql-data:
  percona-data:
  mongo-data:
  psmdb-data:
  openldap-config:
  openldap-data:
  prometheus-data:
  prometheus-secrets:
  grafana-data:
