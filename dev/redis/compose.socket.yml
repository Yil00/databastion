# Compose override for the Unix-socket target test (ROADMAP phase 9 follow-up "#239 re-review N1"):
# publishes each dev Valkey / Redis server's Unix socket to the host, so the connector integration
# tests can declare a `socket:` target (`tls: disable`, `redis.server_uid: 999`) and run the Audit
# stream over it. Opt-in, not part of `make dev-redis`; the TLS port is unchanged. The server (uid
# 999) gets the host user's group (DATABASTION_DEV_REDIS_SOCKET_GID, `id -g`) as a supplementary
# group; the directories are the host user's, setgid and `2770`, so the socket (`770`) inherits that
# group: only the host user (and root) can connect, no world-writable directory or socket.
#
#   install -d -m 2770 dev/.state/redis-socket/valkey dev/.state/redis-socket/redis
#   export DATABASTION_DEV_REDIS_SOCKET_GID="$(id -g)"
#   docker compose -f dev/docker-compose.yml -f dev/redis/compose.socket.yml --profile redis \
#     up -d --wait valkey redis
#
# The sockets are then dev/.state/redis-socket/{valkey,redis}/redis.sock (dev/agent-it.sh redis
# finds them through the services' environment). Paths are relative to dev/ (the project
# directory).
services:
  valkey:
    group_add: ["${DATABASTION_DEV_REDIS_SOCKET_GID:?set DATABASTION_DEV_REDIS_SOCKET_GID (id -g)}"]
    environment:
      DATABASTION_DEV_REDIS_SOCKET_DIR: /run/databastion-redis
    volumes:
      - ./.state/redis-socket/valkey:/run/databastion-redis
  redis:
    group_add: ["${DATABASTION_DEV_REDIS_SOCKET_GID:?set DATABASTION_DEV_REDIS_SOCKET_GID (id -g)}"]
    environment:
      DATABASTION_DEV_REDIS_SOCKET_DIR: /run/databastion-redis
    volumes:
      - ./.state/redis-socket/redis:/run/databastion-redis
