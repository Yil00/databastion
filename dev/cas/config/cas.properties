# Apereo CAS dev service (opt-in profile `cas`, dev/README.md "Apereo CAS", ADR-0041 decision 14).
# DEV ONLY: fake users, fake services, plain HTTP on 127.0.0.1. Never reuse this configuration.
# Mounted read-only at /etc/cas/config/cas.properties; ${...} values come from the container
# environment (DEV_CAS_*, set by dev/docker-compose.yml from dev/.env; not named CAS_* so that
# Spring never binds them to a CAS setting).

# Plain HTTP inside the Compose network, published on 127.0.0.1 only (as the Keycloak dev service):
# the agent never contacts CAS (ADR-0041 decision 9), and the smoke test talks to it from the host.
server.port=8080
server.ssl.enabled=false
cas.server.name=${DEV_CAS_SERVER_NAME}
cas.server.prefix=${cas.server.name}/cas
# The SSO cookie would otherwise only travel over HTTPS.
cas.tgc.secure=false
# No servlet access log (not an Audit source in phase 8, ADR-0041 open question 5; Jetty would
# write it in the read-only war directory).
server.jetty.accesslog.enabled=false

# Static users (`login::password`): the e-mail-shaped logins are in dev/ground-truth.json
# (dev/seed/generate.py CAS_USERS), `svc-monitoring` is a service account.
cas.authn.accept.enabled=true
cas.authn.accept.name=databastion-dev-static
cas.authn.accept.users=camille.martin@example.org::${DEV_CAS_USER_PASSWORD},hugo.durand@example.net::${DEV_CAS_USER_PASSWORD},olivia.smith@example.com::${DEV_CAS_USER_PASSWORD},svc-monitoring::${DEV_CAS_USER_PASSWORD}

# JSON service registry: dev/cas/services, staged by dev/cas/files-init.sh with the ADR-0041
# decision 6 permissions and mounted read-only. No default (embedded) services.
cas.service-registry.core.init-from-json=false
cas.service-registry.core.init-default-services=false
cas.service-registry.json.location=file:/etc/cas/services
cas.service-registry.json.watcher-enabled=true

# Audit trail (ADR-0041 decision 7): the Slf4j destination, JSON, one record per line, written by
# config/log4j2.xml to /var/log/cas/cas_audit.log (dev/.state/logs/cas on the host). No request
# headers (cookies) and no validation assertion (principal attributes) in the records.
cas.audit.engine.enabled=true
cas.audit.engine.audit-format=JSON
cas.audit.engine.include-validation-assertion=false
cas.audit.slf4j.enabled=true
cas.audit.slf4j.use-single-line=true
cas.audit.slf4j.auditable-fields=who,what,when,action,client_ip,server_ip,user_agent

# JPA ticket registry in the dev PostgreSQL (database `cas`, role `cas`, dev/cas/db-init.sh), so
# that the CAS store guard (ADR-0041 decision 5) has a real ticket table to see. Tickets are
# encrypted by default (CAS 8.0 default; DATABASTION_DEV_CAS_TICKET_CRYPTO=false stores them in
# clear, for `security.ticket_registry_unencrypted`). With no key configured, CAS generates the
# ticket, cookie and webflow keys at each start (and prints them in its log): dev only.
cas.ticket.registry.jpa.url=jdbc:postgresql://postgres:5432/cas
cas.ticket.registry.jpa.user=cas
cas.ticket.registry.jpa.password=${DEV_CAS_DB_PASSWORD}
cas.ticket.registry.jpa.driver-class=org.postgresql.Driver
cas.ticket.registry.jpa.dialect=org.hibernate.dialect.PostgreSQLDialect
cas.ticket.registry.jpa.ddl-auto=update
cas.ticket.registry.jpa.crypto.enabled=${DEV_CAS_TICKET_CRYPTO:true}
# One CAS node: no distributed locking (it needs a Spring Integration lock table that the JPA
# ticket registry does not create; without it no service ticket is issued).
cas.ticket.registry.core.enable-locking=false

# OpenID Connect (the OIDC services of the registry): issuer under the server name, keystore
# generated at the first start in the container's writable state directory, never in the registry
# directory (connector-cas refuses a registry directory holding key material).
cas.authn.oidc.core.issuer=${cas.server.prefix}/oidc
cas.authn.oidc.jwks.file-system.jwks-file=file:/var/lib/cas/keystore.jwks

# No actuator endpoint (ADR-0041 decision 9: the agent uses none): none exposed over HTTP and no
# access by default. The container healthcheck reads a static resource.
management.endpoints.access.default=none
management.endpoints.web.exposure.exclude=*
