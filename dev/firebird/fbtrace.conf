# System audit trace configuration of the DataBastion dev service (ADR-0060 decision 6, proofs 3
# to 6 and 11; refinements R2 rule 4, R8 item 6, R21 and R27 item 2). Named by AuditTraceConfigFile
# in firebird.conf and mounted read-only. Dev only: no value here is a secret.
#
# - The default database section is disabled, so the declared log holds only the declared
#   database (proof 11); the named section's pattern is the database's exact resolved path, with
#   no SIMILAR TO metacharacter (`_` and `%` included: proof 3).
# - Every setting the Partial proofs require (proof 4 and R21), in the named section itself.
# - The services section writes the same log (R27 item 2: services backups are seen there).
# - max_log_size = 0: no rotation in dev (the server creates rotated files 0600, R4; the user
#   guide's default ACL is how production lets the agent read them).

database
{
	enabled = false
}

database = /var/lib/firebird/data/crm.fdb
{
	enabled = true
	log_filename = /var/lib/firebird/audit/audit.log
	max_log_size = 0
	connection_id = 0
	log_connections = true
	log_transactions = true
	log_statement_finish = true
	log_procedure_finish = true
	log_function_finish = true
	log_trigger_finish = true
	log_blr_requests = true
	log_errors = true
	log_initfini = true
	log_sweep = true
	print_perf = true
	time_threshold = 0
	max_sql_length = 65000
}

services
{
	enabled = true
	log_filename = /var/lib/firebird/audit/audit.log
	log_services = true
	log_errors = true
	log_initfini = true
}
