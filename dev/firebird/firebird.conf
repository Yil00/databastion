# Firebird server configuration of the DataBastion dev service (ADR-0060 decisions 3 and 9),
# mounted read-only over the image's /opt/firebird/firebird.conf. Every other key keeps its
# default. Dev only: no value here is a secret.

# Loopback only: the agent shares the service's network namespace (dev/README.md, "Firebird").
RemoteBindAddress = 127.0.0.1
RemoteServicePort = 3050

# Wire encryption required, ChaCha only (decision 3: Arc4 and no encryption are refused by the
# agent), SRP-256 only.
WireCrypt = Required
WireCryptPlugin = ChaCha64, ChaCha
AuthServer = Srp256
UserManager = Srp

# The external-file table of the seed (EXT_EXPORT): only this directory, which the agent never
# reads (decision 5).
ExternalFileAccess = Restrict /var/lib/firebird/data/external
UdfAccess = None
