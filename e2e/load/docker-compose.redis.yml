# Valkey / Redis load run (e2e/load/redis.sh, e2e/load/README.md "Valkey and Redis targets"): merged
# over e2e/docker-compose.yml and e2e/docker-compose.redis.yml (project databastion-load-redis).
# Only the measurement settings change: the targets get a fixed CPU limit (their "capacity"), their
# healthchecks run every 2 s while starting, then every 60 s (each check is a process in the
# measured cgroup), and the agent waits for the proxy only (the run starts one target:
# LOAD_REDIS_ENGINE). The load client (e2e/redis_scenario.py load) runs on the host and measures
# latency from there: the targets' TLS port is published on 127.0.0.1 through redis-net, an
# ordinary bridge network (an internal network cannot publish a port), so the targets have egress
# for the run's length (the residual of #254 review L5, kept for the load run only; the e2e run's
# targets are on the internal agent-net alone). The agent is not on redis-net.

services:
  target-valkey:
    cpus: ${LOAD_DB_CPUS:-2}
    ports:
      - "127.0.0.1:${E2E_VALKEY_PORT:-16379}:6379"
    networks:
      redis-net: {}
    healthcheck:
      interval: 60s
      start_interval: 2s
      start_period: 300s
  target-redis:
    cpus: ${LOAD_DB_CPUS:-2}
    ports:
      - "127.0.0.1:${E2E_REDIS_PORT:-16389}:6379"
    networks:
      redis-net: {}
    healthcheck:
      interval: 60s
      start_interval: 2s
      start_period: 300s
  agent:
    depends_on: !override
      proxy:
        condition: service_started

networks:
  redis-net: {}
