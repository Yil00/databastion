# Load / database impact harness (ROADMAP phase 7, docs/04-mvp-scope.md "Impact on the monitored
# database < 2 % CPU during Discovery"). Driven by e2e/load/run.sh, which generates every secret, the
# test CA and agent.yaml under $LOAD_WORK_DIR at run time. Not a deployment example.
#
# Same topology and hardening as e2e/docker-compose.yml, reduced to what the measurement needs:
#   console-net  internal DB, migrate, web, worker, TLS proxy (published on 127.0.0.1 only)
#   agent-net    internal (no outside access): TLS proxy, agent, the PostgreSQL, MariaDB and MongoDB
#                targets and the one-shot workload clients (pgbench, sysbench).
# The database targets get a fixed CPU limit (LOAD_DB_CPUS, default 2): it is the "CPU capacity" the
# Discovery impact is measured against (e2e/load/README.md). Nothing is published but the proxy.

name: databastion-load

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-console: &console
  <<: *hardening
  build:
    context: ../../console
  image: ${LOAD_CONSOLE_IMAGE:-databastion-console:e2e}
  user: "10001:10001"
  tmpfs: [/tmp]
  networks: [console-net]
  environment: &console-env
    DATABASE_URL_FILE: /run/secrets/db_url
    DATABASTION_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
    LOG_LEVEL: info

# Same pinned images as e2e/docker-compose.yml and dev/docker-compose.yml.
x-postgres-image: &postgres-image postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
x-mariadb-image: &mariadb-image mariadb:11.4.13@sha256:70cc072b29b4a89ae07abb2d4da2c64678a7f2dfe092751bb51c87d67dc1338b
x-mongo-image: &mongo-image mongo:8.0.32@sha256:4968f22d0c6c10ef29952f3e807f62872ba22b3312f25803564fbfc08255efc2
# sysbench 1.1 (Percona build, linux/amd64): the MariaDB workload client (reports the p95 latency).
x-sysbench-image: &sysbench-image perconalab/sysbench:1.1@sha256:f45deecdad67dd55c759353e685fd202b0fb133cbc74fba86402979c5ae0beaf

services:
  # ------------------------------------------------------------------ console side
  db:
    <<: *hardening
    image: *postgres-image
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: databastion
    secrets: [db_password, db_owner_password, db_app_password]
    volumes:
      - ../../deploy/initdb:/docker-entrypoint-initdb.d:ro
    tmpfs: [/var/lib/postgresql/data, /var/run/postgresql, /tmp]
    networks: [console-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d databastion"]
      interval: 2s
      timeout: 5s
      retries: 60

  migrate:
    <<: *console
    command: ["migrate"]
    restart: "no"
    environment:
      DATABASE_MIGRATION_URL_FILE: /run/secrets/db_owner_url
    secrets: [db_owner_url]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *console
    command: ["web"]
    environment:
      <<: *console-env
      DATABASTION_PUBLIC_URL: "https://console.e2e.internal:${LOAD_HTTPS_PORT:-8543}"
      DATABASTION_TRUST_PROXY: "1"
    secrets: [db_url, encryption_key]
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "/usr/local/lib/databastion/healthcheck.mjs"]
      interval: 3s
      timeout: 5s
      start_period: 20s
      retries: 40
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *console
    command: ["worker"]
    secrets: [db_url, encryption_key]
    depends_on:
      migrate:
        condition: service_completed_successfully

  bootstrap-admin:
    <<: *console
    profiles: [tools]
    command: ["bootstrap-admin"]
    restart: "no"
    environment:
      <<: *console-env
      DATABASTION_BOOTSTRAP_ADMIN_USERNAME: load-admin
      DATABASTION_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [db_url, encryption_key, admin_password]

  # TLS reverse proxy (the e2e Caddyfile; test CA generated by run.sh). /metrics answers 404.
  proxy:
    <<: *hardening
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    user: "10001:10001"
    cap_add: [NET_BIND_SERVICE]
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      E2E_HTTPS_PORT: "${LOAD_HTTPS_PORT:-8543}"
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - ${LOAD_WORK_DIR:?set by run.sh}/tls/server.crt:/etc/caddy/certs/server.crt:ro
      - ${LOAD_WORK_DIR:?set by run.sh}/tls/server.key:/etc/caddy/certs/server.key:ro
    tmpfs: [/data, /config, /tmp]
    ports:
      - "127.0.0.1:${LOAD_HTTPS_PORT:-8543}:${LOAD_HTTPS_PORT:-8543}"
    networks:
      console-net:
        aliases: [console.e2e.internal]
      agent-net:
        aliases: [console.e2e.internal]
    depends_on:
      web:
        condition: service_healthy

  # ------------------------------------------------------------------ targets
  # PostgreSQL 17 + pgaudit (dev/postgres), set up as the e2e target (agent role, Discovery grants,
  # pgaudit per database: e2e/target-initdb/), plus the workload role load_app
  # (initdb/25-load-role.sh). The scaled seed is loaded by run.sh after start-up. LOAD_PG_AUDIT=pss
  # (local runs only, see run.sh): the plain pinned image with pg_stat_statements only.
  target-pg:
    <<: *hardening
    build:
      context: ../../dev/postgres
    image: ${LOAD_TARGET_PG_IMAGE:-databastion-dev/postgres:17.11-pgaudit}
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cpus: ${LOAD_DB_CPUS:-2}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/target_pg_password
      POSTGRES_DB: shop
    command:
      - postgres
      - -c
      - shared_preload_libraries=${LOAD_PG_PRELOAD:-pgaudit,pg_stat_statements}
      - -c
      - logging_collector=on
      - -c
      - log_destination=jsonlog
      - -c
      - log_directory=/var/log/databastion
      - -c
      - log_filename=postgresql.log
      - -c
      - log_file_mode=0640
      - -c
      - pg_stat_statements.track=all
      - -c
      - shared_buffers=256MB
    secrets: [target_pg_password, target_agent_password, target_client_password, load_client_password]
    volumes:
      - ../target-initdb/01-agent-role.sh:/docker-entrypoint-initdb.d/01-agent-role.sh:ro
      - ../../dev/seed/out/postgres.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
      - ../target-initdb/20-discovery-grants.sql:/docker-entrypoint-initdb.d/20-discovery-grants.sql:ro
      - ./initdb/25-load-role.sh:/docker-entrypoint-initdb.d/25-load-role.sh:ro
      - ../target-initdb/30-audit.sh:/docker-entrypoint-initdb.d/30-audit.sh:ro
      - target-pg-log:/var/log/databastion
    tmpfs: [/var/lib/postgresql/data, /var/run/postgresql, /tmp]
    networks: [agent-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d shop"]
      # Every 2 s while starting, then every 60 s: each check runs a process inside the target's
      # cgroup (30 to 70 ms of CPU), noise the idle baselines would otherwise have to absorb.
      interval: 60s
      start_period: 600s
      start_interval: 2s
      timeout: 5s
      retries: 3

  # MariaDB 11.4 with the dev configuration (server_audit to a file, rotated at 10 MiB), set up as the
  # e2e target, plus the workload account load_app (initdb/40-load-account.sh).
  target-mariadb:
    <<: *hardening
    image: *mariadb-image
    # dev/mariadb/tls-entrypoint.sh creates the TLS material, then runs the image's entrypoint
    # (an entrypoint override drops the image's CMD: set it again).
    entrypoint: ["/bin/bash", "/usr/local/bin/databastion-tls-entrypoint.sh"]
    command: ["mariadbd"]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cpus: ${LOAD_DB_CPUS:-2}
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/root_password
      UMASK: "0640"
    secrets:
      - source: target_mariadb_password
        target: root_password
      - source: target_mariadb_agent_password
        target: agent_password
      - source: load_client_password
        target: load_client_password
    volumes:
      - ../../dev/mariadb/databastion.cnf:/etc/mysql/conf.d/databastion.cnf:ro
      - ../../dev/seed/out/mariadb.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
      - ../target-initdb/15-agent-password.sh:/docker-entrypoint-initdb.d/15-agent-password.sh:ro
      - ../../dev/mariadb/initdb/20-databastion.sh:/docker-entrypoint-initdb.d/20-databastion.sh:ro
      - ../../dev/mariadb/tls-entrypoint.sh:/usr/local/bin/databastion-tls-entrypoint.sh:ro
      - ./initdb/40-load-account.sh:/docker-entrypoint-initdb.d/40-load-account.sh:ro
      - target-mariadb-log:/var/log/databastion
    # /var/lib/databastion-tls: the dev TLS material (tls-entrypoint.sh), outside the datadir.
    tmpfs: [/var/lib/mysql, /var/lib/databastion-tls, /run/mysqld, /tmp]
    networks:
      agent-net:
        aliases: [mariadb]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      # Every 2 s while starting, then every 60 s: each check runs a process inside the target's
      # cgroup (30 to 70 ms of CPU), noise the idle baselines would otherwise have to absorb.
      interval: 60s
      start_period: 600s
      start_interval: 2s
      timeout: 5s
      retries: 3

  # MongoDB 8.0 Community: Discovery only (no Audit workload here). The dev seed script creates the
  # ADR-0026 agent account; the scaled collections are loaded by run.sh.
  target-mongo:
    <<: *hardening
    image: *mongo-image
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cpus: ${LOAD_DB_CPUS:-2}
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/root_password
      DATABASTION_DB_PASSWORD_FILE: /run/secrets/agent_password
      DO_NOT_TRACK: "1"
    command: ["mongod", "--auth", "--wiredTigerCacheSizeGB", "0.5"]
    secrets:
      - source: target_mongo_password
        target: root_password
      - source: target_mongo_agent_password
        target: agent_password
    volumes:
      - ../../dev/seed/out/mongo.json:/seed/mongo.json:ro
      - ../../dev/mongo/initdb/10-seed.js:/docker-entrypoint-initdb.d/10-seed.js:ro
    tmpfs: [/data/db, /data/configdb, /tmp]
    networks: [agent-net]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>\"/dev/tcp/$$(hostname -i | cut -d' ' -f1)/27017\""]
      # Every 2 s while starting, then every 60 s: each check runs a process inside the target's
      # cgroup (30 to 70 ms of CPU), noise the idle baselines would otherwise have to absorb.
      interval: 60s
      start_period: 600s
      start_interval: 2s
      timeout: 5s
      retries: 3

  # ------------------------------------------------------------------ workload clients (run.sh only)
  # pgbench as load_app (never the agent's account); the generated scripts are mounted read-only.
  # The per-transaction log goes to the container's tmpfs and is printed on stdout at the end.
  pg-bench:
    <<: *hardening
    profiles: [tools]
    image: *postgres-image
    user: "10002:10002"
    entrypoint: ["/bin/sh", "-euc"]
    environment:
      HOME: /tmp
      PGHOST: target-pg
      PGDATABASE: shop
      PGUSER: load_app
    secrets: [load_client_password]
    volumes:
      - ${LOAD_WORK_DIR:?set by run.sh}/workload/pg:/load:ro
    tmpfs: [/tmp]
    networks: [agent-net]

  # sysbench as load_app on target-mariadb; the password goes into a sysbench --config-file written
  # to the container's tmpfs (never on a command line).
  sb-client:
    <<: *hardening
    profiles: [tools]
    image: *sysbench-image
    user: "10002:10002"
    entrypoint: ["/bin/sh", "-euc"]
    environment:
      HOME: /tmp
    secrets: [load_client_password]
    volumes:
      - ${LOAD_WORK_DIR:?set by run.sh}/workload/mariadb:/load:ro
    tmpfs: [/tmp]
    networks: [agent-net]

  # ------------------------------------------------------------------ agent
  agent:
    <<: *hardening
    build:
      context: ../../agent
    image: ${LOAD_AGENT_IMAGE:-databastion-agent:e2e}
    user: "10001:10001"
    group_add: ["999"]
    hostname: load-agent
    command: ["run", "--config", "/etc/databastion/agent.yaml"]
    restart: "no"
    environment:
      DATABASTION_LOG: info
    volumes:
      - agent-state:/var/lib/databastion
      - agent-secrets:/run/databastion-secrets:ro
      - ${LOAD_WORK_DIR:?set by run.sh}/agent/agent.yaml:/etc/databastion/agent.yaml:ro
      - ${LOAD_WORK_DIR:?set by run.sh}/tls/ca.crt:/etc/databastion/console-ca.pem:ro
      - ${LOAD_WORK_DIR:?set by run.sh}/tls/mariadb-ca.pem:/etc/databastion/mariadb-ca.pem:ro
      - target-pg-log:/var/log/target-pg:ro
      - target-mariadb-log:/var/log/target-mariadb:ro
    # No ports: the agent is outbound-only (I1).
    networks: [agent-net]
    depends_on:
      proxy:
        condition: service_started
      target-pg:
        condition: service_healthy
      target-mariadb:
        condition: service_healthy
      target-mongo:
        condition: service_healthy

  # Test helper (run.sh only), no network: secrets volume and log volume ownership, as in e2e.
  agent-files:
    <<: *hardening
    profiles: [tools]
    image: *postgres-image
    user: "0:0"
    cap_add: [CHOWN]
    entrypoint: ["/bin/sh", "-euc"]
    network_mode: none
    volumes:
      - agent-state:/state
      - agent-secrets:/secrets
      - target-pg-log:/pglog
      - target-mariadb-log:/mylog

networks:
  console-net: {}
  agent-net:
    internal: true

volumes:
  agent-state: {}
  agent-secrets: {}
  target-pg-log: {}
  target-mariadb-log: {}

secrets:
  db_password:
    file: ${LOAD_WORK_DIR:?set by run.sh}/secrets/db_password
  db_owner_password:
    file: ${LOAD_WORK_DIR:?set by run.sh}/secrets/db_owner_password
  db_owner_url:
    file: ${LOAD_WORK_DIR:?set by run.sh}/secrets/db_owner_url
  db_app_password:
    file: ${LOAD_WORK_DIR:?set by run.sh}/secrets/db_app_password
  db_url:
    file: ${LOAD_WORK_DIR:?set by run.sh}/secrets/db_url
  encryption_key:
    file: ${LOAD_WORK_DIR:?set by run.sh}/secrets/encryption_key
  admin_password:
    file: ${LOAD_WORK_DIR:?set by run.sh}/secrets/admin_password
  target_pg_password:
    file: ${LOAD_WORK_DIR:?set by run.sh}/secrets/target_pg_password
  target_agent_password:
    file: ${LOAD_WORK_DIR:?set by run.sh}/secrets/target_agent_password
  target_client_password:
    file: ${LOAD_WORK_DIR:?set by run.sh}/secrets/target_client_password
  load_client_password:
    file: ${LOAD_WORK_DIR:?set by run.sh}/secrets/load_client_password
  target_mariadb_password:
    file: ${LOAD_WORK_DIR:?set by run.sh}/secrets/target_mariadb_password
  target_mariadb_agent_password:
    file: ${LOAD_WORK_DIR:?set by run.sh}/secrets/target_mariadb_agent_password
  target_mongo_password:
    file: ${LOAD_WORK_DIR:?set by run.sh}/secrets/target_mongo_password
  target_mongo_agent_password:
    file: ${LOAD_WORK_DIR:?set by run.sh}/secrets/target_mongo_agent_password
