# End-to-end enrollment / revocation harness (phase 1 exit criterion). Driven by e2e/run.sh,
# which generates every secret, the test CA and agent.yaml under $E2E_WORK_DIR at run time.
# Not a deployment example: see deploy/docker-compose.example.yml for that.
#
# Networks:
#   console-net  internal DB, migrate, web, worker, TLS proxy (published on 127.0.0.1 only)
#   agent-net    internal (no outside access): TLS proxy, agent, target PostgreSQL, MySQL,
#                MariaDB, MongoDB and OpenLDAP, and the one-shot clients of the Audit test
#                (pg-client, my-client, mongo-client, ldap-client).
# The agent reaches the console only through the HTTPS proxy and never sees the console DB.
# Mailpit (console-net only) receives the incident e-mails of the Audit test (P4-D).

name: databastion-e2e

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-console: &console
  <<: *hardening
  build:
    context: ../console
  # E2E_CONSOLE_IMAGE / E2E_AGENT_IMAGE (local runs with E2E_SKIP_BUILD=1 only): other image tags.
  image: ${E2E_CONSOLE_IMAGE:-databastion-console:e2e}
  user: "10001:10001"
  tmpfs: [/tmp]
  networks: [console-net]
  environment: &console-env
    DATABASE_URL_FILE: /run/secrets/db_url
    DATABASTION_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
    LOG_LEVEL: info

x-postgres-image: &postgres-image postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
# Same pinned images as dev/docker-compose.yml.
x-mysql-image: &mysql-image mysql:8.4.11@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
x-mariadb-image: &mariadb-image mariadb:11.4.13@sha256:70cc072b29b4a89ae07abb2d4da2c64678a7f2dfe092751bb51c87d67dc1338b
x-mongo-image: &mongo-image mongo:8.0.32@sha256:4968f22d0c6c10ef29952f3e807f62872ba22b3312f25803564fbfc08255efc2
# Built from dev/openldap (Debian's slapd), as in dev/docker-compose.yml.
x-openldap-image: &openldap-image ${E2E_TARGET_LDAP_IMAGE:-databastion-dev/openldap:bookworm-20260918}

services:
  # ------------------------------------------------------------------ console side
  db:
    <<: *hardening
    image: *postgres-image
    # The postgres entrypoint starts as root to prepare PGDATA, then drops to `postgres`.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: databastion
    secrets: [db_password, db_owner_password, db_app_password]
    volumes:
      - ../deploy/initdb:/docker-entrypoint-initdb.d:ro
    tmpfs: [/var/lib/postgresql/data, /var/run/postgresql, /tmp]
    networks: [console-net]
    healthcheck:
      # TCP probe: the temporary initdb server listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d databastion"]
      interval: 2s
      timeout: 5s
      retries: 60

  migrate:
    <<: *console
    command: ["migrate"]
    restart: "no"
    environment:
      DATABASE_MIGRATION_URL_FILE: /run/secrets/db_owner_url
    secrets: [db_owner_url]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *console
    command: ["web"]
    environment:
      <<: *console-env
      DATABASTION_PUBLIC_URL: "https://console.e2e.internal:${E2E_HTTPS_PORT:-8443}"
      DATABASTION_TRUST_PROXY: "1"
      DATABASTION_METRICS_TOKEN_FILE: /run/secrets/metrics_token
    secrets: [db_url, encryption_key, metrics_token]
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "/usr/local/lib/databastion/healthcheck.mjs"]
      interval: 3s
      timeout: 5s
      start_period: 20s
      retries: 40
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *console
    command: ["worker"]
    environment:
      <<: *console-env
      # The SMTP sender verifies Mailpit's STARTTLS certificate (issued by the run's test CA) against
      # Node's default trust store, which this variable extends.
      NODE_EXTRA_CA_CERTS: /etc/databastion/e2e-ca.pem
    volumes:
      - ${E2E_WORK_DIR:?set by run.sh}/tls/ca.crt:/etc/databastion/e2e-ca.pem:ro
    secrets: [db_url, encryption_key]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-shot (`docker compose run --rm bootstrap-admin`), started by run.sh only.
  bootstrap-admin:
    <<: *console
    profiles: [tools]
    command: ["bootstrap-admin"]
    restart: "no"
    environment:
      <<: *console-env
      DATABASTION_BOOTSTRAP_ADMIN_USERNAME: e2e-admin
      DATABASTION_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [db_url, encryption_key, admin_password]

  # TLS reverse proxy (test CA generated by run.sh). /metrics is not published through it.
  proxy:
    <<: *hardening
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    user: "10001:10001"
    # The caddy binary carries the cap_net_bind_service file capability: it must stay in the
    # bounding set or exec fails. The proxy listens on an unprivileged port anyway.
    cap_add: [NET_BIND_SERVICE]
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      E2E_HTTPS_PORT: "${E2E_HTTPS_PORT:-8443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${E2E_WORK_DIR:?set by run.sh}/tls/server.crt:/etc/caddy/certs/server.crt:ro
      - ${E2E_WORK_DIR:?set by run.sh}/tls/server.key:/etc/caddy/certs/server.key:ro
    tmpfs: [/data, /config, /tmp]
    ports:
      - "127.0.0.1:${E2E_HTTPS_PORT:-8443}:${E2E_HTTPS_PORT:-8443}"
    networks:
      console-net:
        aliases: [console.e2e.internal]
      agent-net:
        aliases: [console.e2e.internal]
    depends_on:
      web:
        condition: service_healthy

  # Mail sink of the incident notifications (P4-D): the console's e-mail channel sends to it over
  # STARTTLS (required here) with SMTP AUTH, certificate issued by the run's test CA for the name
  # `mailpit`. Its
  # HTTP API (port 8025) is only reachable inside console-net: run.sh reads the messages from the
  # web container. Messages live in /tmp (tmpfs).
  mailpit:
    <<: *hardening
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    user: "10001:10001"
    environment:
      MP_SMTP_BIND_ADDR: "0.0.0.0:2525"
      MP_UI_BIND_ADDR: "0.0.0.0:8025"
      MP_SMTP_TLS_CERT: /etc/mailpit/server.crt
      MP_SMTP_TLS_KEY: /etc/mailpit/server.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_DISABLE_VERSION_CHECK: "true"
      # SMTP AUTH required: "e2e-smtp:<password>" generated by run.sh (the console's channel sends
      # the password after STARTTLS only).
      MP_SMTP_AUTH_FILE: /run/secrets/mailpit_auth
    secrets: [mailpit_auth]
    volumes:
      - ${E2E_WORK_DIR:?set by run.sh}/tls/mailpit.crt:/etc/mailpit/server.crt:ro
      - ${E2E_WORK_DIR:?set by run.sh}/tls/mailpit.key:/etc/mailpit/server.key:ro
    tmpfs: [/tmp]
    networks: [console-net]

  # ------------------------------------------------------------------ agent side
  target-pg:
    <<: *hardening
    # The dev image (dev/postgres: PostgreSQL 17 + pgaudit), for the Audit path (P4-D).
    # E2E_PG_AUDIT=pss (local runs only, see run.sh) uses the plain pinned image instead, with
    # pg_stat_statements only (Limited level): for hosts that cannot build dev/postgres.
    build:
      context: ../dev/postgres
    image: ${E2E_TARGET_PG_IMAGE:-databastion-dev/postgres:17.11-pgaudit}
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/target_pg_password
      POSTGRES_DB: shop
    # Server-wide: the preloaded libraries and the log, as in dev/docker-compose.yml. The pgaudit
    # settings are per database (target-initdb/30-audit.sh), so a server without pgaudit gets none.
    # The jsonlog goes to the target-pg-log volume, read-only in the agent (postgres.audit_log):
    # directory 0750 and files 0640 of the postgres user (uid / gid 999, run.sh prepares the
    # volume); the agent reads them through its supplementary group 999, the e2e stand-in for the
    # production ACL of ADR-0012 ("Audit log files").
    command:
      - postgres
      - -c
      - shared_preload_libraries=${E2E_PG_PRELOAD:-pgaudit,pg_stat_statements}
      - -c
      - logging_collector=on
      - -c
      - log_destination=jsonlog
      - -c
      - log_directory=/var/log/databastion
      - -c
      - log_filename=postgresql.log
      - -c
      - log_file_mode=0640
      - -c
      - pg_stat_statements.track=all
    # The superuser password stays here; target-initdb/ creates the agent's least-privilege,
    # read-only role `databastion_agent` (I4) from the target_agent_password secret. The database
    # is loaded with the committed dev seed for PostgreSQL (the data of dev/ground-truth.json,
    # value-bearing table names included), then gets the per-schema Discovery grants (P2-E), then
    # the Audit setup and the two test client roles (30-audit.sh, target_client_password).
    secrets: [target_pg_password, target_agent_password, target_client_password]
    volumes:
      - ./target-initdb/01-agent-role.sh:/docker-entrypoint-initdb.d/01-agent-role.sh:ro
      - ../dev/seed/out/postgres.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
      - ./target-initdb/20-discovery-grants.sql:/docker-entrypoint-initdb.d/20-discovery-grants.sql:ro
      - ./target-initdb/30-audit.sh:/docker-entrypoint-initdb.d/30-audit.sh:ro
      - target-pg-log:/var/log/databastion
    tmpfs: [/var/lib/postgresql/data, /var/run/postgresql, /tmp]
    networks: [agent-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d shop"]
      interval: 2s
      timeout: 5s
      retries: 60

  # One-shot database client of the Audit test (run.sh only, `docker compose run`): pg_dump and
  # queries as the test roles e2e_exporter / e2e_analyst (never the agent's account). Output goes
  # to /dev/null inside the container: the dumped rows never reach a log.
  pg-client:
    <<: *hardening
    profiles: [tools]
    image: *postgres-image
    user: "10002:10002"
    entrypoint: ["/bin/sh", "-euc"]
    environment:
      HOME: /tmp
      PGHOST: target-pg
      PGDATABASE: shop
    secrets: [target_client_password]
    tmpfs: [/tmp]
    networks: [agent-net]

  # One-shot MariaDB client of the Audit test (run.sh only): mariadb-dump and queries as the test
  # accounts e2e_exporter / e2e_analyst of target-mariadb (never the agent's account), over TLS
  # verified against the target's dev CA (copied out by run.sh). Output goes to /dev/null.
  my-client:
    <<: *hardening
    profiles: [tools]
    image: *mariadb-image
    user: "10002:10002"
    entrypoint: ["/bin/sh", "-euc"]
    environment:
      HOME: /tmp
    secrets: [target_client_password]
    volumes:
      - ${E2E_WORK_DIR:?set by run.sh}/tls/mariadb-ca.pem:/etc/e2e/mariadb-ca.pem:ro
    tmpfs: [/tmp]
    networks: [agent-net]

  # MySQL / MariaDB targets: the dev images and configuration (dev/mysql, dev/mariadb, mounted
  # read-only), loaded with the committed dev seed (dev/seed/out/{mysql,mariadb}.sql, value-bearing
  # table name included). target-initdb/15-agent-password.sh reads the agent password from its
  # Docker secret (/run/secrets/agent_password) for dev's 20-databastion.sh, which creates the ADR-0018 minimal account
  # `databastion` (SELECT on the application database only, REQUIRE SSL, MAX_USER_CONNECTIONS 5;
  # MariaDB: MAX_STATEMENT_TIME 30); dev's mysql/initdb/30-tls.sh and mariadb/tls-entrypoint.sh create the throwaway CA and the server
  # certificate (SAN `mysql` / `mariadb`: the network aliases the agent connects to). run.sh copies
  # the CA out of the container and hands it to the agent (`ca_file`, `tls: verify_full`) and to
  # my-client. target-mariadb also writes its server_audit log to the target-mariadb-log volume
  # (Audit, P4-D) and gets the test client accounts (target-initdb/35-mariadb-clients.sh).
  target-mysql:
    <<: *hardening
    image: *mysql-image
    # The entrypoint starts as root to prepare the data directory, then drops to `mysql`.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/root_password
    secrets:
      # Same in-container names in both targets (15-agent-password.sh, run.sh account checks).
      - source: target_mysql_password
        target: root_password
      - source: target_mysql_agent_password
        target: agent_password
    volumes:
      - ../dev/mysql/databastion.cnf:/etc/mysql/conf.d/databastion.cnf:ro
      - ../dev/seed/out/mysql.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
      - ./target-initdb/15-agent-password.sh:/docker-entrypoint-initdb.d/15-agent-password.sh:ro
      - ../dev/mysql/initdb/20-databastion.sh:/docker-entrypoint-initdb.d/20-databastion.sh:ro
      - ../dev/mysql/initdb/30-tls.sh:/docker-entrypoint-initdb.d/30-tls.sh:ro
    tmpfs: [/var/lib/mysql, /var/run/mysqld, /tmp]
    networks:
      agent-net:
        aliases: [mysql]
    healthcheck:
      # TCP, as the agent account (the temporary server of the initialization has no network):
      # healthy once the seed, the account and the TLS material are in place. The password is
      # read inside the container, never on a command line.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$(cat /run/secrets/agent_password)\" mysql -h 127.0.0.1 -u databastion --ssl-mode=VERIFY_IDENTITY --ssl-ca=/var/lib/mysql/ca.pem -N -e 'SELECT 1 FROM hr.employees LIMIT 1'"]
      interval: 2s
      timeout: 5s
      retries: 120

  target-mariadb:
    <<: *hardening
    image: *mariadb-image
    # dev/mariadb/tls-entrypoint.sh creates the TLS material, then runs the image's entrypoint
    # (an entrypoint override drops the image's CMD: set it again).
    entrypoint: ["/bin/bash", "/usr/local/bin/databastion-tls-entrypoint.sh"]
    command: ["mariadbd"]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/root_password
      # Files the server creates are 0640 (group mysql, gid 999): the server_audit log is readable
      # by the agent through its supplementary group 999 only (the e2e stand-in for the production
      # ACL of ADR-0023 "Grants and file access"; dev uses 0644).
      UMASK: "0640"
    secrets:
      # Same in-container names in both targets (15-agent-password.sh, run.sh account checks).
      - source: target_mariadb_password
        target: root_password
      - source: target_mariadb_agent_password
        target: agent_password
      # Audit test client roles e2e_exporter / e2e_analyst (target-initdb/35-mariadb-clients.sh).
      - source: target_client_password
        target: client_password
    volumes:
      - ../dev/mariadb/databastion.cnf:/etc/mysql/conf.d/databastion.cnf:ro
      - ../dev/seed/out/mariadb.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
      - ./target-initdb/15-agent-password.sh:/docker-entrypoint-initdb.d/15-agent-password.sh:ro
      - ../dev/mariadb/initdb/20-databastion.sh:/docker-entrypoint-initdb.d/20-databastion.sh:ro
      - ../dev/mariadb/tls-entrypoint.sh:/usr/local/bin/databastion-tls-entrypoint.sh:ro
      - ./target-initdb/35-mariadb-clients.sh:/docker-entrypoint-initdb.d/35-mariadb-clients.sh:ro
      # server_audit file output (dev/mariadb/databastion.cnf), read-only in the agent
      # (mysql.audit_log); run.sh hands the volume to mysql 999:999, 0750.
      - target-mariadb-log:/var/log/databastion
    tmpfs: [/var/lib/mysql, /run/mysqld, /tmp]
    networks:
      agent-net:
        aliases: [mariadb]
    healthcheck:
      # --connect fails while the entrypoint's temporary (--skip-networking) server is seeding.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 120

  # MongoDB target (P5, ADR-0026 / ADR-0027): the dev image pin, loaded with the committed dev seed
  # (dev/seed/out/mongo.json) by dev's initdb/10-seed.js, which also creates the agent's ADR-0026
  # account `databastion` (custom role databastionDiscovery: find + listCollections on `app` only,
  # SCRAM-SHA-256) from the agent_password secret (DATABASTION_DB_PASSWORD_FILE: never in the
  # environment); target-initdb/mongo-20-clients.js adds the Audit test accounts e2e_exporter /
  # e2e_analyst (built-in `read` on `app`). Community edition: the Audit source is the structured
  # JSON server log (ADR-0027, level Limited at most), written with `slowms` 0 to the
  # target-mongo-log volume (directory 0750, file 0640, mongodb 999:999, prepared by run.sh), read
  # by the agent through its supplementary group 999 (mongodb.audit_log, format server_log). No
  # profiler grant: the file source is preferred (ADR-0027 decision 5). No TLS: the agent uses the
  # explicit `disable_insecure` opt-in on the internal network (SCRAM-SHA-256 only).
  target-mongo:
    <<: *hardening
    image: *mongo-image
    # The entrypoint starts as root to prepare /data, then drops to `mongodb` (gosu).
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/root_password
      DATABASTION_DB_PASSWORD_FILE: /run/secrets/agent_password
      # mongosh (initialization scripts): no telemetry attempt from the internal network.
      DO_NOT_TRACK: "1"
    command:
      - mongod
      - --auth
      - --slowms
      - "0"
      - --wiredTigerCacheSizeGB
      - "0.25"
      - --logpath
      - /var/log/databastion/mongod.log
      - --logappend
    secrets:
      - source: target_mongo_password
        target: root_password
      - source: target_mongo_agent_password
        target: agent_password
      - source: target_client_password
        target: client_password
    volumes:
      - ../dev/seed/out/mongo.json:/seed/mongo.json:ro
      - ../dev/mongo/initdb/10-seed.js:/docker-entrypoint-initdb.d/10-seed.js:ro
      - ./target-initdb/mongo-20-clients.js:/docker-entrypoint-initdb.d/20-clients.js:ro
      - target-mongo-log:/var/log/databastion
    tmpfs: [/data/db, /data/configdb, /tmp]
    networks: [agent-net]
    healthcheck:
      # A TCP connect to the container's own address, not a database command: the entrypoint's
      # temporary initialization server listens on 127.0.0.1 only, so this succeeds once the seed
      # and the accounts are in place and the final server (with --auth) listens. No command, no
      # authentication: nothing in the audit log the agent reads.
      test: ["CMD", "bash", "-c", "exec 3<>\"/dev/tcp/$$(hostname -i | cut -d' ' -f1)/27017\""]
      interval: 2s
      timeout: 5s
      retries: 120

  # One-shot MongoDB client of the Audit test (run.sh only): mongodump as e2e_exporter, mongosh
  # queries as e2e_analyst (never the agent's account). The password is read from the secret file
  # inside the container (a mongodump --config file in /tmp, a mongosh script's connect()), never on
  # a command line. Output goes to /dev/null.
  mongo-client:
    <<: *hardening
    profiles: [tools]
    image: *mongo-image
    user: "10002:10002"
    entrypoint: ["/bin/sh", "-euc"]
    environment:
      HOME: /tmp
      DO_NOT_TRACK: "1"
    secrets: [target_client_password]
    tmpfs: [/tmp]
    networks: [agent-net]

  # OpenLDAP target (phase 6, ADR-0029): the dev image (Debian slapd, dev/openldap: cn=config,
  # accesslog overlay logging reads, writes and sessions, failed operations included, and the ACL
  # of the service DN cn=databastion,ou=services: read on the tree except the credential
  # attributes, read on cn=accesslog). Loaded with the committed dev seed plus the two Audit test
  # client entries (run.sh writes both into $E2E_WORK_DIR/ldap/seed.ldif; the clients' DNs hold a
  # ground-truth person name, so a DN in clear on the console side is an I2 leak). The passwords
  # come from Docker secrets (*_FILE: dev's entrypoint hashes the files with slappasswd -T).
  # LDAPS on 636 with the dev CA the entrypoint creates (SAN `openldap`, the network alias), which
  # run.sh copies out for the agent (`tls: verify_full`) and ldap-client. run.sh adds the clients'
  # read access to the data database through ldapi (cn=config, not audited).
  target-ldap:
    <<: *hardening
    build:
      context: ../dev/openldap
    image: *openldap-image
    # The entrypoint builds cn=config and the database as root, then slapd binds 389 / 636 and
    # drops to `openldap`.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, NET_BIND_SERVICE]
    environment:
      LDAP_ADMIN_PASSWORD_FILE: /run/secrets/root_password
      DATABASTION_DB_PASSWORD_FILE: /run/secrets/agent_password
    secrets:
      - source: target_ldap_password
        target: root_password
      - source: target_ldap_agent_password
        target: agent_password
    volumes:
      - ${E2E_WORK_DIR:?set by run.sh}/ldap/seed.ldif:/seed/openldap.ldif:ro
    tmpfs: [/etc/ldap/slapd.d, /var/lib/ldap, /run/slapd, /tmp]
    networks:
      agent-net:
        aliases: [openldap]
    healthcheck:
      # ldapi + EXTERNAL on cn=config (as dev): does not touch the audited tree, so no
      # cn=accesslog record.
      test: ["CMD", "ldapsearch", "-Q", "-Y", "EXTERNAL", "-H", "ldapi:///", "-b", "cn=config", "-s", "base", "-LLL", "dn"]
      interval: 2s
      timeout: 5s
      retries: 120

  # One-shot LDAP client of the Audit test (run.sh only): a bulk subtree ldapsearch as the exporter
  # entry, value filters as the analyst entry (never the agent's DN), over LDAPS verified against
  # the dev CA. The bind DN comes from an ldaprc file and the filters from a file (-f), the
  # password from the secret file (-y): none of them on a command line. Output goes to /dev/null.
  ldap-client:
    <<: *hardening
    profiles: [tools]
    image: *openldap-image
    user: "10002:10002"
    entrypoint: ["/bin/sh", "-euc"]
    environment:
      HOME: /tmp
    secrets: [target_client_password]
    volumes:
      - ${E2E_WORK_DIR:?set by run.sh}/ldap/client:/etc/e2e/ldap:ro
    tmpfs: [/tmp]
    networks: [agent-net]

  agent:
    <<: *hardening
    build:
      context: ../agent
    image: ${E2E_AGENT_IMAGE:-databastion-agent:e2e}
    user: "10001:10001"
    # gid of the targets' postgres, mysql and mongodb users (999 in the pinned images): read access
    # to their audit log files (0640), nothing else.
    group_add: ["999"]
    hostname: e2e-agent
    command: ["run", "--config", "/etc/databastion/agent.yaml"]
    restart: "no"
    environment:
      # Debug: the invariant I2 log scan (run.sh) also covers the agent's debug-level logging.
      # Third-party crates stay capped at warn by the agent itself.
      DATABASTION_LOG: debug
    volumes:
      - agent-state:/var/lib/databastion
      - agent-secrets:/run/databastion-secrets:ro
      - ${E2E_WORK_DIR:?set by run.sh}/agent/agent.yaml:/etc/databastion/agent.yaml:ro
      - ${E2E_WORK_DIR:?set by run.sh}/tls/ca.crt:/etc/databastion/console-ca.pem:ro
      # CAs of target-mysql / target-mariadb, copied out of the targets by run.sh.
      - ${E2E_WORK_DIR:?set by run.sh}/tls/mysql-ca.pem:/etc/databastion/mysql-ca.pem:ro
      - ${E2E_WORK_DIR:?set by run.sh}/tls/mariadb-ca.pem:/etc/databastion/mariadb-ca.pem:ro
      # Dev CA of target-ldap (LDAPS), copied out by run.sh.
      - ${E2E_WORK_DIR:?set by run.sh}/tls/ldap-ca.pem:/etc/databastion/ldap-ca.pem:ro
      # pgaudit jsonlog of target-pg (postgres.audit_log in agent.yaml), read-only.
      - target-pg-log:/var/log/target-pg:ro
      # server_audit log of target-mariadb (mysql.audit_log in agent.yaml), read-only.
      - target-mariadb-log:/var/log/target-mariadb:ro
      # Structured JSON server log of target-mongo (mongodb.audit_log in agent.yaml), read-only.
      - target-mongo-log:/var/log/target-mongo:ro
    # No ports: the agent is outbound-only (I1).
    networks: [agent-net]
    depends_on:
      proxy:
        condition: service_started
      target-pg:
        condition: service_healthy
      target-mysql:
        condition: service_healthy
      target-mariadb:
        condition: service_healthy
      target-mongo:
        condition: service_healthy
      target-ldap:
        condition: service_healthy

  # Test helper (run.sh only), no network. As root (CHOWN only): hands the secrets volume to
  # the agent user and checks the state volume owner / mode. As 10001: writes the enrollment
  # token and the agent's target password, received on stdin, as 0600 files; reads
  # identity.json and checks its owner / mode. Also hands the target-pg, target-mariadb and
  # target-mongo log volumes to the postgres / mysql / mongodb user (uid / gid 999 in the three
  # images, mode 0750) before the targets start, and creates mongod's log file (0640).
  agent-files:
    <<: *hardening
    profiles: [tools]
    image: *postgres-image
    user: "0:0"
    cap_add: [CHOWN]
    entrypoint: ["/bin/sh", "-euc"]
    network_mode: none
    volumes:
      - agent-state:/state
      - agent-secrets:/secrets
      - target-pg-log:/pglog
      - target-mariadb-log:/mylog
      - target-mongo-log:/mongolog

networks:
  console-net: {}
  agent-net:
    internal: true

volumes:
  agent-state: {}
  agent-secrets: {}
  target-pg-log: {}
  target-mariadb-log: {}
  target-mongo-log: {}

secrets:
  db_password:
    file: ${E2E_WORK_DIR:?set by run.sh}/secrets/db_password
  db_owner_password:
    file: ${E2E_WORK_DIR:?set by run.sh}/secrets/db_owner_password
  db_owner_url:
    file: ${E2E_WORK_DIR:?set by run.sh}/secrets/db_owner_url
  db_app_password:
    file: ${E2E_WORK_DIR:?set by run.sh}/secrets/db_app_password
  db_url:
    file: ${E2E_WORK_DIR:?set by run.sh}/secrets/db_url
  encryption_key:
    file: ${E2E_WORK_DIR:?set by run.sh}/secrets/encryption_key
  metrics_token:
    file: ${E2E_WORK_DIR:?set by run.sh}/secrets/metrics_token
  admin_password:
    file: ${E2E_WORK_DIR:?set by run.sh}/secrets/admin_password
  target_pg_password:
    file: ${E2E_WORK_DIR:?set by run.sh}/secrets/target_pg_password
  target_agent_password:
    file: ${E2E_WORK_DIR:?set by run.sh}/secrets/target_agent_password
  target_client_password:
    file: ${E2E_WORK_DIR:?set by run.sh}/secrets/target_client_password
  mailpit_auth:
    file: ${E2E_WORK_DIR:?set by run.sh}/secrets/mailpit_auth
  target_mysql_password:
    file: ${E2E_WORK_DIR:?set by run.sh}/secrets/target_mysql_password
  target_mysql_agent_password:
    file: ${E2E_WORK_DIR:?set by run.sh}/secrets/target_mysql_agent_password
  target_mariadb_password:
    file: ${E2E_WORK_DIR:?set by run.sh}/secrets/target_mariadb_password
  target_mariadb_agent_password:
    file: ${E2E_WORK_DIR:?set by run.sh}/secrets/target_mariadb_agent_password
  target_mongo_password:
    file: ${E2E_WORK_DIR:?set by run.sh}/secrets/target_mongo_password
  target_mongo_agent_password:
    file: ${E2E_WORK_DIR:?set by run.sh}/secrets/target_mongo_agent_password
  target_ldap_password:
    file: ${E2E_WORK_DIR:?set by run.sh}/secrets/target_ldap_password
  target_ldap_agent_password:
    file: ${E2E_WORK_DIR:?set by run.sh}/secrets/target_ldap_agent_password
