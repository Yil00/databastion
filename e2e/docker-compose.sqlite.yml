# SQLite targets end to end (ROADMAP P10-D, ADR-0059 decision 10): merged over docker-compose.yml
# by e2e/sqlite.sh only (`-f docker-compose.yml -f docker-compose.sqlite.yml`, project
# databastion-e2e-sqlite). The main e2e run (run.sh) never reads this file. Only db, migrate, web,
# worker, proxy, bootstrap-admin, sqlite-files-init, target-sqlite, agent and agent-files are
# started: none of the other targets of docker-compose.yml.
#
#   sqlite-files-init  one-shot (dev/sqlite/files-init.sh, as dev): the sqlite-data volume's `data`
#                      directory owned by the application's account (10020) and the group the agent
#                      reads through (10030, not the agent's own group), mode 2750 (ADR-0059
#                      decision 2).
#   target-sqlite      the application: dev/sqlite/build.py in the pinned Python image (the dev
#                      sidecar's), as 10020:10030 with umask 027, writes crm.db (rollback journal),
#                      app.db (WAL) and intl.db (UTF-16le) from the committed seed on its first
#                      start, then keeps app.db open (its -wal and -shm exist) and inserts a row
#                      into writer_heartbeat every 20 s. No network, read-only root file system.
#                      Also paced.db (build.py --paced-tables 400: WAL, held open, 400 small tables of
#                      integers, no ground truth), the truncated -shm scenario's own file.
#                      Restarted after a crash: sqlite.sh truncates paced.db's -shm during a scan,
#                      which raises SIGBUS in every process mapping it, the agent's reader at its
#                      next unit and this writer at its next heartbeat (seconds later: the reader
#                      sees the truncated file first, not a WAL index the restarted writer rebuilt).
#   agent              the files through the same volume mounted read-only (`:ro`, ADR-0059
#                      decision 2: the file system must be read-only for the agent), its root file
#                      system read-only (x-hardening), group 10030 added; no secret but its own.

x-python-image: &python-image python:3.13.16-slim-bookworm@sha256:a1165e272e578941b84abc79e4ab38a0305cd12803a5c4247979ac7655f4d641

services:
  sqlite-files-init:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, FSETID]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASTION_DEV_SQLITE_UID: "10020"
      DATABASTION_DEV_AGENT_GID: "10030"
    entrypoint: ["sh", "/usr/local/bin/files-init.sh", "setup"]
    volumes:
      - ../dev/sqlite/files-init.sh:/usr/local/bin/files-init.sh:ro
      - sqlite-data:/state
    restart: "no"

  target-sqlite:
    image: *python-image
    user: "10020:10030"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    # -I: isolated (no user site, no PYTHON* variables); -B: no bytecode written.
    entrypoint: ["python3", "-I", "-B", "/opt/sqlite/build.py"]
    command: ["serve", "--manifest", "/opt/seed/sqlite.json", "--out", "/srv/sqlite/data",
              "--ready", "/tmp/databastion-ready", "--write-every", "20", "--paced-tables", "400"]
    volumes:
      - ../dev/sqlite/build.py:/opt/sqlite/build.py:ro
      - ../dev/seed/out:/opt/seed:ro
      - sqlite-data:/srv/sqlite
    depends_on:
      sqlite-files-init: {condition: service_completed_successfully}
    restart: on-failure
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/databastion-ready"]
      interval: 2s
      timeout: 5s
      retries: 60

  agent:
    # Only the mounts of this run: agent.yaml, the console CA, the secrets volume (the enrollment
    # token only) and the SQLite files, read-only.
    group_add: !override ["10030"]
    volumes: !override
      - agent-state:/var/lib/databastion
      - agent-secrets:/run/databastion-secrets:ro
      - ${E2E_WORK_DIR:?set by sqlite.sh}/agent/agent.yaml:/etc/databastion/agent.yaml:ro
      - ${E2E_WORK_DIR:?set by sqlite.sh}/tls/ca.crt:/etc/databastion/console-ca.pem:ro
      - sqlite-data:/srv/sqlite:ro
    depends_on: !override
      proxy:
        condition: service_started
      target-sqlite:
        condition: service_healthy

  agent-files:
    volumes: !override
      - agent-state:/state
      - agent-secrets:/secrets

volumes:
  sqlite-data: {}
