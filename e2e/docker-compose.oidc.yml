# OIDC login scenario (ROADMAP P8-D, ADR-0038): merged over docker-compose.yml by e2e/oidc.sh only
# (`-f docker-compose.yml -f docker-compose.oidc.yml`, project databastion-e2e-oidc). The main e2e
# run (run.sh) never reads this file. Only db, migrate, web, proxy, bootstrap-admin and keycloak
# are started: no agent, no target, no worker.
#
# Inside the containers the issuer is not a loopback address, so ADR-0038 decision 2 requires
# https:// for it and every endpoint: Keycloak serves HTTPS only, with a certificate issued by the
# run's throwaway CA (oidc.sh, SAN keycloak.e2e.internal), and the console trusts that CA for the
# provider only (DATABASTION_OIDC_CA_FILE, decision 3). The console stays the production image
# (NODE_ENV=production): no plain-HTTP exception, no development build.

services:
  web:
    environment:
      DATABASTION_OIDC_ENABLED: "1"
      DATABASTION_OIDC_ISSUER_URL: "https://keycloak.e2e.internal:${E2E_KEYCLOAK_PORT:-8444}/realms/databastion"
      DATABASTION_OIDC_CLIENT_ID: databastion-console
      DATABASTION_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      DATABASTION_OIDC_CA_FILE: /etc/databastion/oidc-ca.pem
      DATABASTION_OIDC_DISPLAY_NAME: "Keycloak (e2e)"
      DATABASTION_OIDC_GROUPS_ATTRIBUTE_PATH: groups
      # Reads the groups claim only, which only the realm's administrators set (decision 7); a
      # token without it makes contains() fail, which is no role.
      DATABASTION_OIDC_ROLE_ATTRIBUTE_PATH: "contains(groups, 'databastion-admins') && 'admin' || contains(groups, 'databastion-analysts') && 'analyst'"
      DATABASTION_OIDC_ROLE_ATTRIBUTE_STRICT: "1"
      # The two configurations of the scenario (oidc.sh): sign-up off with group and domain
      # filters (defaults below), then sign-up on without filters (empty values are unset) and with
      # refresh tokens.
      DATABASTION_OIDC_ALLOW_SIGN_UP: "${E2E_OIDC_ALLOW_SIGN_UP:-0}"
      DATABASTION_OIDC_ALLOWED_GROUPS: "${E2E_OIDC_ALLOWED_GROUPS-databastion-admins,databastion-analysts}"
      DATABASTION_OIDC_ALLOWED_DOMAINS: "${E2E_OIDC_ALLOWED_DOMAINS-databastion.test}"
      # Second configuration only: the refresh token kept, encrypted, and revoked at logout.
      DATABASTION_OIDC_USE_REFRESH_TOKEN: "${E2E_OIDC_USE_REFRESH_TOKEN:-0}"
    secrets: [oidc_client_secret]
    volumes:
      - ${E2E_WORK_DIR:?set by oidc.sh}/tls/ca.crt:/etc/databastion/oidc-ca.pem:ro
    depends_on:
      keycloak:
        condition: service_started

  # Keycloak in production mode (`start`), HTTPS only (no HTTP listener), local caches, the embedded
  # dev-file database in the container (discarded with it). The realm is generated by oidc.sh from
  # dev/keycloak/databastion-realm.json (redirect URIs of this console, one more test user). The
  # admin password, the client secret and the users' password come from Docker secrets, exported by
  # the wrapper below only for Keycloak's own process (never in the container's environment, so
  # never in `docker inspect`); the realm file's ${...} placeholders are resolved from them at
  # import. Not read-only: Keycloak builds its runtime under /opt/keycloak at startup.
  keycloak:
    image: ${E2E_KEYCLOAK_IMAGE:-keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/bash", "-euc"]
    command:
      - |
        KC_BOOTSTRAP_ADMIN_USERNAME=admin
        KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)"
        KEYCLOAK_CONSOLE_CLIENT_SECRET="$$(cat /run/secrets/oidc_client_secret)"
        KEYCLOAK_DEV_USER_PASSWORD="$$(cat /run/secrets/keycloak_user_password)"
        export KC_BOOTSTRAP_ADMIN_USERNAME KC_BOOTSTRAP_ADMIN_PASSWORD KEYCLOAK_CONSOLE_CLIENT_SECRET KEYCLOAK_DEV_USER_PASSWORD
        exec /opt/keycloak/bin/kc.sh start --import-realm --db=dev-file --cache=local \
          --hostname="https://keycloak.e2e.internal:$${E2E_KEYCLOAK_PORT}" \
          --https-port="$${E2E_KEYCLOAK_PORT}" \
          --https-certificate-file=/etc/keycloak/tls/server.crt \
          --https-certificate-key-file=/etc/keycloak/tls/server.key \
          --https-protocols=TLSv1.3,TLSv1.2
    environment:
      E2E_KEYCLOAK_PORT: "${E2E_KEYCLOAK_PORT:-8444}"
    secrets: [keycloak_admin_password, oidc_client_secret, keycloak_user_password]
    volumes:
      - ${E2E_WORK_DIR:?set by oidc.sh}/keycloak/databastion-realm.json:/opt/keycloak/data/import/databastion-realm.json:ro
      - ${E2E_WORK_DIR:?set by oidc.sh}/tls/keycloak.crt:/etc/keycloak/tls/server.crt:ro
      - ${E2E_WORK_DIR:?set by oidc.sh}/tls/keycloak.key:/etc/keycloak/tls/server.key:ro
    tmpfs: [/tmp]
    # Published on the loopback address only, on the same port as inside, so that the issuer URL
    # is the same for the console (network alias) and the scenario's browser (oidc.sh, host).
    ports:
      - "127.0.0.1:${E2E_KEYCLOAK_PORT:-8444}:${E2E_KEYCLOAK_PORT:-8444}"
    networks:
      console-net:
        aliases: [keycloak.e2e.internal]

secrets:
  oidc_client_secret:
    file: ${E2E_WORK_DIR:?set by oidc.sh}/secrets/oidc_client_secret
  keycloak_admin_password:
    file: ${E2E_WORK_DIR:?set by oidc.sh}/secrets/keycloak_admin_password
  keycloak_user_password:
    file: ${E2E_WORK_DIR:?set by oidc.sh}/secrets/keycloak_user_password
